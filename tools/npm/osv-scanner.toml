# The only vulnerabilities OpenSSF Scorecard's Vulnerabilities check (OSV-Scanner)
# accepts. OSV-Scanner reads this file because it sits next to the lockfile it
# applies to, tools/npm/package-lock.json, and to nothing else.
#
# All ten are in dependencies bundled inside the npm CLI pinned in this
# directory: brace-expansion 5.0.9, ip-address 10.5.0 and undici 6.28.0. They
# are not in the app's package-lock.json and not in the Worker bundle. Each
# entry expires on its own (ignoreUntil), so the exception lapses instead of
# lingering. See CONTRIBUTING.md#dependencies.
#
# Remove an entry when Dependabot moves tools/npm to an npm that bundles a
# patched version, and the whole file when none is left.

[[IgnoredVulns]]
id = "GHSA-6j4f-fj2g-mc7p"
ignoreUntil = 2026-12-01T00:00:00Z
reason = "Bundled inside the npm CLI pinned in tools/npm, used only at CI build time; not in the app lockfile or the Worker bundle; no npm release bundles a patched version yet. Remove when Dependabot moves tools/npm to one."

