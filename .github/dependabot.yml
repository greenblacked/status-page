version: 2
updates:
  # dev is paused (CONTRIBUTING.md), so version updates open against stage
  # and reach main when the owner promotes stage. Put every target-branch
  # below back to dev when dev returns. Security updates ignore
  # target-branch and open against the default branch, without the groups and
  # ignores below: retarget one at stage, since main takes only stage.
  # Dependabot's ecosystem for pnpm is `npm`: it reads pnpm-lock.yaml and
  # keeps it in step with package.json. Moving the pnpm that CI runs
  # (packageManager and its hash) is a change made by hand, which
  # scripts/ci/pnpm-pin.sh checks (CONTRIBUTING.md#dependencies).
  - package-ecosystem: npm
    directory: /
    target-branch: stage
    schedule:
      interval: weekly
    # Propose a release only once it has been public for a week. Most
    # hijacked npm releases are found and pulled within days; waiting
    # keeps them out of the lockfile. Security updates are not delayed.
    cooldown:
      default-days: 7
    groups:
      # Alone, and first (a dependency joins the first group that matches):
      # the WebKit shards run in Playwright's image, pinned in ci.yml, so a
      # Playwright bump stays red until that image tag and digest move to the
      # same version. Grouped with the rest it would hold their updates up.
      playwright:
        patterns:
          - "@playwright/*"
          - "playwright"
          - "playwright-core"
      development-dependencies:
        dependency-type: development
      production-dependencies:
        dependency-type: production
    ignore:
      # Node types must match the oldest supported runtime (engines and
      # .nvmrc), or typecheck accepts APIs that fail at runtime on it. Move
      # this major by hand together with engines.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    target-branch: stage
    schedule:
      interval: weekly
    # The same, shorter: Actions are pinned by SHA and reviewed, but a
    # retagged or compromised release still deserves a few days to surface.
    cooldown:
      default-days: 3
    groups:
      github-actions:
        patterns:
          - "*"
