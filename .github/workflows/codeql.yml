name: CodeQL

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    # Weekly, so a newly published rule still finds this repository.
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          # No build step exists yet, so CodeQL scans the sources directly.
          # `actions` scans .github/workflows itself (untrusted input in
          # run:, over-broad permissions, unpinned actions), which is where
          # the deploy token lives.
          languages: javascript-typescript, actions
          queries: security-and-quality

      # No `category`: with two languages, each gets its own default,
      # /language:<language>, which for javascript-typescript is the value
      # this step used to set, so its alert history carries on.
      - uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
