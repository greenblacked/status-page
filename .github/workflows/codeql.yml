name: CodeQL

on:
  push:
    branches: [main, stage, dev]
  pull_request:
    branches: [main, stage, dev]
  schedule:
    # Weekly, so a newly published rule still finds this repository.
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        # `actions` scans .github/workflows itself (untrusted input in run:,
        # over-broad permissions, unpinned actions), which is where the
        # deploy token lives.
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          # No build step exists yet, so CodeQL scans the sources directly.
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          # One job and one category per language. The TypeScript category
          # keeps the name earlier analyses used, so its alert history and
          # the pull request comparison against the base branch carry on.
          category: /language:${{ matrix.language }}
