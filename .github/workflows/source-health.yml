name: Source health

# Live canary for the vendor collectors. PR CI stays offline and
# deterministic; this is the one place that calls the real vendor endpoints,
# so a changed payload shape shows up as an issue instead of as a board that
# quietly shows "Unknown".
#
# When an issue opens: a collector that cannot be read gets three attempts in
# a run (20 s after the first, 90 s after the second when it timed out or could
# not connect, counted from the end of each attempt), and an issue only after
# it has failed in two consecutive runs at least 30 minutes apart (a manual
# re-run right after a failing run does not count), so a vendor that is slow
# for an hour does not open and close an issue by itself. A real outage
# therefore reports one run later, hours later when the runs are delayed. The
# first failing run is remembered in a closed `source-health-state` issue,
# which needs only the `issues: write` below (the label is created on first
# use, and the issue is also found by a marker in its body). A run where most sources fail at
# once (the runner's network) changes nothing. The deploy-health issue below
# is unchanged: it opens on the first failing run.

on:
  schedule:
    # Hourly, off the top of the hour when shared runners are busiest.
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-health
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          # This job installs nothing, so it needs no package cache, and
          # setup-node must not start one on its own.
          package-manager-cache: false
      # The collectors use only Node built-ins (fetch, TextDecoder), and the
      # script runs on Node's own TypeScript stripping, so there is no
      # `pnpm install`: nothing from the lockfile executes in a job that can
      # write issues.
      - name: Probe vendor sources
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types --disable-warning=ExperimentalWarning scripts/ci/source-health.ts --issues

  deploy-health:
    # The deployed board's own view of itself: every source above can read
    # cleanly from a runner while production reads nothing from Cloudflare
    # or serves a board with an old timestamp. /readyz says so, and a single `deploy-health` issue stays open until it answers
    # 200 again. PRODUCTION_URL is a repository variable, not a deployment
    # environment's, so this job never enters an environment and never
    # sees its secrets.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: No PRODUCTION_URL set
        if: vars.PRODUCTION_URL == ''
        run: echo "::notice::set the PRODUCTION_URL repository variable to check the production deployment's /readyz (CONTRIBUTING.md#deploying)"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: vars.PRODUCTION_URL != ''
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: vars.PRODUCTION_URL != ''
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      # Same as the probe above: Node built-ins only, no `pnpm install`.
      - name: Check the production deployment
        if: vars.PRODUCTION_URL != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: node --experimental-strip-types --disable-warning=ExperimentalWarning scripts/ci/source-health.ts --deploy-health
