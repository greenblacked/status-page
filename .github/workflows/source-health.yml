name: Source health

# Live canary for the vendor collectors. PR CI stays offline and
# deterministic; this is the one place that calls the real vendor endpoints,
# so a changed payload shape shows up as an issue instead of as a board that
# quietly shows "Unknown".

on:
  schedule:
    # Hourly, off the top of the hour when shared runners are busiest.
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-health
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          # setup-node caches npm automatically because package.json names
          # npm in packageManager. This job installs nothing, so skip it.
          package-manager-cache: false
      # The collectors use only Node built-ins (fetch, TextDecoder), and the
      # script runs on Node's own TypeScript stripping, so there is no
      # `npm ci`: nothing from the lockfile executes in a job that can write
      # issues.
      - name: Probe vendor sources
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types --disable-warning=ExperimentalWarning scripts/ci/source-health.ts --issues

  deploy-health:
    # The deployed board's own view of itself: every source above can read
    # cleanly from a runner while production serves an old snapshot (a
    # stopped Cron Trigger) or reads nothing from Cloudflare. /readyz says
    # so, and a single `deploy-health` issue stays open until it answers
    # 200 again. PRODUCTION_URL is a repository variable, not a deployment
    # environment's, so this job never enters an environment and never
    # sees its secrets.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: No PRODUCTION_URL set
        if: vars.PRODUCTION_URL == ''
        run: echo "::notice::set the PRODUCTION_URL repository variable to check the production deployment's /readyz (CONTRIBUTING.md#deploying)"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: vars.PRODUCTION_URL != ''
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: vars.PRODUCTION_URL != ''
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      # Same as the probe above: Node built-ins only, no `npm ci`.
      - name: Check the production deployment
        if: vars.PRODUCTION_URL != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: node --experimental-strip-types --disable-warning=ExperimentalWarning scripts/ci/source-health.ts --deploy-health
