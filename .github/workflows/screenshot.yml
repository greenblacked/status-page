name: Board screenshot

# Captures the running board with live vendor data, for the README. A local
# machine or sandbox without outbound access to the vendors would only show
# Unknown cards, so the capture runs here, where the vendors are reachable.
#
# Run it from the Actions tab, download the `board-screenshot` artifact, and
# commit the image as docs/board.png. It also runs on pull requests that
# change this file, so an edit to the capture is checked by its own output.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/screenshot.yml

permissions:
  contents: read

concurrency:
  group: screenshot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the toolchain (pnpm install)
        uses: ./.github/actions/setup # zizmor: ignore[self-repository] actionlint 1.7.12 rejects $/ yet
      - run: pnpm run build

      - name: Capture the board
        shell: bash
        run: |
          set -euo pipefail
          setsid pnpm run preview --port 4173 --strictPort >"$RUNNER_TEMP/preview.log" 2>&1 &
          preview_pid=$!
          trap 'kill -- -"$preview_pid" 2>/dev/null || true' EXIT

          # The first request collects every vendor, which fills the server's
          # 45-second snapshot cache; the capture below reuses that snapshot.
          ready=false
          for _ in $(seq 1 30); do
            if curl --silent --fail --max-time 30 -o "$RUNNER_TEMP/board.html" http://127.0.0.1:4173/; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            cat "$RUNNER_TEMP/preview.log"
            exit 1
          fi

          mkdir -p shots
          google-chrome --headless=new --no-sandbox --hide-scrollbars \
            --window-size=1440,1100 --virtual-time-budget=8000 \
            --screenshot=shots/board.png http://127.0.0.1:4173/

          {
            echo "### Board screenshot"
            echo
            echo "States in the captured snapshot:"
            echo
            for state in Operational Degraded Outage Maintenance Unknown; do
              echo "- $state: $(grep -o ">$state<" "$RUNNER_TEMP/board.html" | wc -l)"
            done
          } >>"$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: board-screenshot
          path: shots/board.png
          if-no-files-found: error
          retention-days: 7
