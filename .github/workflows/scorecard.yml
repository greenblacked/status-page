name: Scorecard

# OpenSSF Scorecard grades the repository's supply-chain practices: pinned
# dependencies, token permissions, branch protection, code review, SAST,
# signed releases and more. Findings land in the Security tab as code
# scanning alerts, and the score is published for the README badge at
# https://scorecard.dev/viewer/?uri=github.com/greenblacked/status-page.
#
# Scorecard's published results require this exact shape: it runs on the
# default branch only, the job uses no top-level env or defaults, and it
# takes id-token: write to sign the upload.

on:
  push:
    branches: [main]
  # Re-graded when branch protection changes, and weekly for new checks.
  branch_protection_rule:
  schedule:
    - cron: '32 5 * * 2'
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 7

      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
