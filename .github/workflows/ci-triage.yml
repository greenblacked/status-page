name: CI triage

# Explains failed PR workflows in one comment per PR, kept up to date, and
# keeps a `ci-failed` label in step with it.
#
# workflow_run is privileged: it can hold a write token even when the run that
# triggered it came from a fork. So this job never checks out or executes code
# from the pull request. It checks out only the default branch, sparsely, for
# the triage script, and everything else is GitHub API reads plus one comment
# and one label.
#
# workflow_run fires only for workflow files on the default branch, so this
# starts working once it is merged to main.

on:
  workflow_run: # zizmor: ignore[dangerous-triggers] never checks out or runs PR code, see above
    workflows: [CI, CodeQL, Dependency review]
    types: [completed]

permissions: {}

concurrency:
  # Serialise per PR branch; the script recomputes full state each time, so a
  # run dropped by the concurrency queue loses nothing.
  group: ci-triage-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  triage:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Trusted code only: the default branch, never the PR head.
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: scripts/ci
          persist-credentials: false

      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { triage } = require(`${process.env.GITHUB_WORKSPACE}/scripts/ci/ci-triage.cjs`);
            await triage({ github, context, core });
