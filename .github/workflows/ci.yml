name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (node ${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # package.json declares ">=22.13.0 <25". The pinned leg proves the
        # exact toolchain in .nvmrc; the 24 leg covers the top of that range,
        # which nothing exercised before.
        include:
          - label: pinned
            node-version-file: .nvmrc
          - label: '24'
            node-version: '24'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ${{ matrix.node-version-file }}
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Pin npm
        run: npm install --global npm@11.9.0
      - name: Verify declared toolchain
        env:
          LABEL: ${{ matrix.label }}
        run: |
          if [ "$LABEL" = pinned ]; then
            test "$(node --version)" = "v$(cat .nvmrc)"
          else
            case "$(node --version)" in "v$LABEL".*) ;; *) echo "::error::expected Node $LABEL, got $(node --version)"; exit 1 ;; esac
          fi
          test "$(npm --version)" = "11.9.0"
      - run: npm ci
      # Checks every installed tarball against the registry's signature
      # (and provenance attestation, where one is published), so a package
      # altered in a cache or on the way in fails the run before it is
      # tested or built. Install scripts have run by now; this catches
      # tampering, not a malicious release the registry signed.
      - name: Verify npm registry signatures
        run: npm audit signatures
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Smoke-test built preview
        # scripts/ci/smoke.sh holds the checks, shared with deploy.yml.
        # /readyz may be 503 here: a runner that cannot reach a vendor
        # still serves a correct, all-Unknown board.
        shell: bash
        run: |
          set -uo pipefail
          log_file="${RUNNER_TEMP}/status-bar-preview.log"
          setsid npm run preview -- --port 4173 --strictPort >"$log_file" 2>&1 &
          preview_pid=$!
          cleanup() {
            kill -- -"$preview_pid" 2>/dev/null || true
            wait "$preview_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          if ! ./scripts/ci/smoke.sh http://127.0.0.1:4173; then
            cat "$log_file"
            exit 1
          fi

  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Repository hygiene
        run: ./scripts/ci/hygiene.sh

      - name: Documentation links
        run: ./scripts/ci/links.sh

      # release.yml refuses a tag with no notes; catch that here, not at tag time.
      - name: Changelog covers package.json version
        run: ./scripts/ci/release-notes.sh >/dev/null

      - name: Shell scripts
        run: shellcheck scripts/ci/*.sh scripts/release/*.sh

  commits:
    name: commit messages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Need both sides of the range to list the commits this PR adds.
          fetch-depth: 0
          # The base branch below is fetched anonymously: this repository is
          # public, and no later step needs a token in .git/config.
          persist-credentials: false

      - name: Check Conventional Commits
        # Branch names are attacker-controlled on a fork PR, so the ref goes
        # through the environment instead of being interpolated into the shell.
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          ./scripts/ci/commits.sh "origin/$BASE_REF..HEAD"

  branch:
    name: branch name
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

        with:
          persist-credentials: false

      - name: Check the branch naming convention
        # CONTRIBUTING.md#branches: <prefix>/<short-kebab-description>. The
        # head branch name is attacker-controlled on a fork PR, so it goes
        # through the environment instead of being interpolated.
        env:
          BRANCH: ${{ github.head_ref }}
        run: ./scripts/ci/branch.sh "$BRANCH"

  workflows:
    name: workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pinned by digest: Dependabot does not see images used in `run:`, so
      # bump this by hand from https://hub.docker.com/r/rhysd/actionlint/tags.
      - name: actionlint
        run: |
          docker run --rm \
            --volume "$PWD:/repo" \
            --workdir /repo \
            rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color
