name: CI

# One workflow, one job per concern, so a red check names its cause: lint,
# typecheck, unit tests, build and SSR smoke, browser tests, commit and
# branch conventions, and the workflows themselves. `CI OK` at the end
# passes only when every job above it passed or was skipped on purpose; it
# is the one check branch protection needs to require (CONTRIBUTING.md#ci).

on:
  pull_request:
    branches: [main, stage, dev]
  push:
    branches: [main, stage, dev]
  # A merge queue tests the exact commit it is about to merge.
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A new push to a pull request replaces the run for the old one. Runs on
  # dev, stage and main always finish, so every commit there keeps its result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the toolchain (pnpm install)
        uses: ./.github/actions/setup # zizmor: ignore[self-repository] actionlint 1.7.12 rejects $/ yet

      - name: Lint and format (Biome)
        run: pnpm exec biome ci --reporter=github .

      - name: Repository hygiene
        run: ./scripts/ci/hygiene.sh

      # The design tokens are the only source of type, radius, material and colour.
      - name: Design tokens
        run: ./scripts/ci/tokens.sh

      - name: Documentation links
        run: ./scripts/ci/links.sh

      # release.yml refuses a tag with no notes; catch that here, not at tag time.
      - name: Changelog covers package.json version
        run: ./scripts/ci/release-notes.sh >/dev/null

      # packageManager is pnpm@X.Y.Z+sha512.<128 hex>, the pin Corepack checks.
      - name: pnpm pin in sync
        run: ./scripts/ci/pnpm-pin.sh check

      - name: Shell scripts
        run: shellcheck scripts/ci/*.sh scripts/release/*.sh

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the toolchain (pnpm install)
        uses: ./.github/actions/setup # zizmor: ignore[self-repository] actionlint 1.7.12 rejects $/ yet
      - name: Typecheck
        run: pnpm run typecheck

  test:
    name: test (node ${{ matrix.node || 'pinned' }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # package.json declares "^22.22.2 || ^24.15.0", the Node lines the
        # toolchain supports. The pinned leg is the exact toolchain in .nvmrc; the 24
        # leg covers the top of that range.
        node: ['', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the toolchain (pnpm install)
        uses: ./.github/actions/setup # zizmor: ignore[self-repository] actionlint 1.7.12 rejects $/ yet
        with:
          node-version: ${{ matrix.node }}

      - name: Unit tests with coverage (pnpm run test:coverage)
        if: matrix.node == ''
        run: pnpm run test:coverage
      - name: Unit tests (pnpm test)
        if: matrix.node != ''
        run: pnpm test

      - name: Coverage summary
        if: matrix.node == '' && !cancelled()
        run: node --experimental-strip-types --disable-warning=ExperimentalWarning scripts/ci/job-summary.ts coverage
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.node == '' && !cancelled()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  build:
    name: build (node ${{ matrix.node || 'pinned' }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the toolchain (pnpm install)
        uses: ./.github/actions/setup # zizmor: ignore[self-repository] actionlint 1.7.12 rejects $/ yet
        with:
          node-version: ${{ matrix.node }}

      - name: Build (pnpm run build)
        run: pnpm run build

      - name: One board cache in the built server
        # A cache declared beside a server function is built twice (once per
        # chunk), so the page and the API stop sharing it.
        run: node --experimental-strip-types --disable-warning=ExperimentalWarning scripts/ci/single-board-cache.ts dist/server

      - name: Smoke-test built preview
        # scripts/ci/smoke.sh holds the checks, shared with deploy.yml.
        # /readyz may be 503 here: a runner that cannot reach a vendor
        # still serves a correct, all-Unknown board.
        run: |
          set -uo pipefail
          log_file="${RUNNER_TEMP}/status-bar-preview.log"
          setsid pnpm run preview --port 4173 --strictPort >"$log_file" 2>&1 &
          preview_pid=$!
          cleanup() {
            kill -- -"$preview_pid" 2>/dev/null || true
            wait "$preview_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          if ! ./scripts/ci/smoke.sh http://127.0.0.1:4173; then
            cat "$log_file"
            exit 1
          fi

      - name: Bundle size summary
        if: matrix.node == ''
        run: node --experimental-strip-types --disable-warning=ExperimentalWarning scripts/ci/job-summary.ts bundle

      # The browser tests run against exactly this build.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.node == ''
        with:
          name: node-build
          path: dist/
          if-no-files-found: error
          retention-days: 1

  e2e:
    # One shard per engine and device group. Every project but one runs the
    # whole suite (the Chromium tablet runs only the search reveal, floating
    # bar, field's fill and self-hosted Inter tests), but WebKit is several
    # times slower than Chromium in CI, so each WebKit project gets its own
    # shard. The three Chromium projects together took about 8.5 minutes, and
    # over 10 on a slower run, which hit the 10-minute step timeout, so they
    # are split: desktop alone, mobile and tablet together. Together the
    # shards run every project exactly once.
    name: browser tests (${{ matrix.shard }})
    needs: build
    runs-on: ubuntu-latest
    # Per shard: a Chromium shard runs one or two projects and a WebKit shard
    # one, which take 3 to 5 minutes, plus getting the browser. Chromium is
    # downloaded, with its 32 MB of system libraries from apt. WebKit's
    # libraries are about 125 MB from apt, and on a slow runner that fetch
    # took over 30 minutes and failed the job, so the WebKit shards run in
    # Playwright's own image (below), which has them and the browser already.
    # apt is not retried: a killed apt keeps the dpkg lock, so a retry in the
    # same job would fail. Pulling the image (about 1 GB compressed) happens
    # before the steps, so only this job limit bounds it.
    timeout-minutes: 40
    # Only the WebKit shards set a container; for Chromium the matrix has no
    # value, and the job runs on the runner itself.
    container: ${{ matrix.container }}
    strategy:
      # A slow or failing shard must not hide the results of the others.
      fail-fast: false
      matrix:
        include:
          - shard: chromium-desktop
            browser: chromium
            projects: desktop
          - shard: chromium-mobile
            browser: chromium
            projects: mobile,tablet
          # The image carries WebKit's system libraries and the browser build
          # that matches @playwright/test, so these shards fetch nothing from
          # apt. Pinned by digest (Scorecard) and by tag for the reader; when
          # @playwright/test moves, the "Check the browser" step fails until
          # both follow: `docker buildx imagetools inspect <image>:<tag>`
          # prints the new digest. Dependabot opens @playwright/test bumps
          # alone (.github/dependabot.yml) for that reason.
          - shard: desktop-safari
            browser: webkit
            projects: Desktop Safari
            container: &playwright-image mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
          - shard: iphone
            browser: webkit
            projects: iPhone 17 Pro
            container: *playwright-image
          - shard: ipad
            browser: webkit
            projects: iPad Pro 11
            container: *playwright-image
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the toolchain (pnpm install)
        uses: ./.github/actions/setup # zizmor: ignore[self-repository] actionlint 1.7.12 rejects $/ yet
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: node-build
          path: dist/

      # Chromium is downloaded to match the @playwright/test version in the
      # lockfile. The install is split in two so the log shows which phase is
      # slow: the apt libraries or the download. The WebKit shards skip it:
      # their image has the browser.
      - name: Install Playwright's browser
        if: matrix.container == ''
        timeout-minutes: 30
        env:
          BROWSER: ${{ matrix.browser }}
        run: |
          pnpm exec playwright install-deps "$BROWSER"
          pnpm exec playwright install "$BROWSER"

      # Playwright looks for the exact browser build its version expects. If
      # the install did not place it, or @playwright/test moved but the image
      # did not, say so here instead of failing every test with "Executable
      # doesn't exist".
      - name: Check the browser
        env:
          BROWSER: ${{ matrix.browser }}
          CONTAINER: ${{ matrix.container }}
        run: |
          node - <<'EOF'
          const { existsSync } = require("node:fs");
          const playwright = require("@playwright/test");
          const version = require("@playwright/test/package.json").version;
          const browser = process.env.BROWSER;
          const path = playwright[browser].executablePath();
          if (!existsSync(path)) {
            const why = process.env.CONTAINER
              ? `The Playwright image in this job is for another @playwright/test version than the lockfile's ${version}: move the image tag and digest in the matrix to it.`
              : `"playwright install" did not place the browser for @playwright/test ${version}.`;
            console.error(`::error::${browser} is not at ${path}. ${why}`);
            process.exit(1);
          }
          console.log(`${browser} for Playwright ${version}: ${path}`);
          EOF

      - name: Browser tests (Playwright)
        # Shards take 3 to 5 minutes. Chromium's three projects in one shard
        # took about 8.5 minutes, and over 10 on a slower run, which hit this
        # limit, hence the two Chromium shards. It stops a hung suite long before the job limit does.
        timeout-minutes: 10
        env:
          # Comma-separated project names from playwright.config.ts.
          PROJECTS: ${{ matrix.projects }}
        run: |
          args=()
          IFS=, read -ra names <<<"$PROJECTS"
          for name in "${names[@]}"; do
            args+=(--project="$name")
          done
          pnpm run test:e2e "${args[@]}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  history:
    name: browser tests (history build)
    runs-on: ubuntu-latest
    # Headroom for a slow apt: Chromium's libraries are about 32 MB.
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # Read at build time; the runner needs it too, since the @history tests
      # skip themselves without it.
      VITE_STATUS_HISTORY: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the toolchain (pnpm install)
        uses: ./.github/actions/setup # zizmor: ignore[self-repository] actionlint 1.7.12 rejects $/ yet

      # The build differs from the `build` job's, so it is made here instead
      # of downloaded. Only the desktop project runs, which is Chromium.
      - name: Install Playwright's Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build with the uptime history strip (pnpm run build)
        run: pnpm run build

      - name: Browser tests for the history build (Playwright)
        run: pnpm exec playwright test --project=desktop --grep @history

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report-history
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  server:
    name: browser tests (node server)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # Makes playwright.config.ts start src/node/serve.ts, the server the
      # Docker image runs, instead of `vite preview`; the @node-server tests
      # skip themselves without it.
      E2E_SERVER: node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the toolchain (pnpm install)
        uses: ./.github/actions/setup # zizmor: ignore[self-repository] actionlint 1.7.12 rejects $/ yet

      - name: Install Playwright's Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build (pnpm run build)
        run: pnpm run build

      # Chromium on a desktop and on a phone: what differs from the preview
      # is the server, not the engine, so WebKit is left to the other jobs.
      - name: Browser tests behind the production server (Playwright)
        run: pnpm exec playwright test --project=desktop --project=mobile --grep @node-server

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report-node-server
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  image:
    name: docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Dockerfile that release.yml publishes, built for this runner and
      # started the way the README runs it. Nothing is pushed.
      # BuildKit's own image is pinned by tag and digest, as in release.yml;
      # move the two together.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea

      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: status-page:smoke

      - name: Smoke-test the image
        run: ./scripts/ci/image-smoke.sh status-page:smoke

  commits:
    name: commit messages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Need both sides of the range to list the commits this PR adds.
          fetch-depth: 0
          # The base branch below is fetched anonymously: this repository is
          # public, and no later step needs a token in .git/config.
          persist-credentials: false

      - name: Check Conventional Commits
        # Branch names are attacker-controlled on a fork PR, so the ref goes
        # through the environment instead of being interpolated into the shell.
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          ./scripts/ci/commits.sh "origin/$BASE_REF..HEAD"

  branch:
    name: branch name
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the branch naming convention
        # CONTRIBUTING.md#branches: <prefix>/<short-kebab-description>, and
        # which branch may open a pull request into which (main from stage,
        # stage from dev). The head branch name is attacker-controlled on a
        # fork PR, so it goes through the environment instead of being
        # interpolated.
        env:
          BRANCH: ${{ github.head_ref }}
          BASE: ${{ github.base_ref }}
          FROM_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        run: ./scripts/ci/branch.sh "$BRANCH" "$BASE"

  workflows:
    name: workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pinned by digest: Dependabot does not see images used in `run:`, so
      # bump this by hand from https://hub.docker.com/r/rhysd/actionlint/tags.
      - name: actionlint
        run: |
          docker run --rm \
            --volume "$PWD:/repo" \
            --workdir /repo \
            rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color

      # Security audit of the workflows: template injection, over-broad
      # permissions, credential persistence, cache poisoning, impostor or
      # known-vulnerable action commits. Findings annotate the pull request
      # and fail the job; a deliberate exception carries a
      # `# zizmor: ignore[...]` comment with its reason next to it.
      - name: zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: 1.30.1
          advanced-security: false
          annotations: true

  ci-ok:
    # The single required check. `always()` makes it run, and report, even
    # when a job it needs failed, so a red job can never leave the pull
    # request waiting on a check that was skipped.
    name: CI OK
    if: always()
    needs: [lint, typecheck, test, build, e2e, history, server, image, commits, branch, workflows]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check every job passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.value.result)\t\(.key)"' <<<"$RESULTS"
          # `e2e` is a matrix: its result is `failure` or `cancelled` if any
          # shard failed, was cancelled or timed out.
          # `skipped` is fine: commit and branch checks run on pull requests only.
          if jq -e 'any(.[]; .result == "failure" or .result == "cancelled")' <<<"$RESULTS" >/dev/null; then
            echo "::error::a required job failed or was cancelled"
            exit 1
          fi
          # The browser shards must have run: never let them be skipped.
          if ! jq -e '.e2e.result == "success"' <<<"$RESULTS" >/dev/null; then
            echo "::error::the browser tests did not pass"
            exit 1
          fi
