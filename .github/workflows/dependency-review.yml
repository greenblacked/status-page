name: Dependency review

# A pull request is reviewed as GitHub compares it (its base to its head). A
# push to dev is reviewed against stage, the branch its pull request goes
# into: the merge-base of stage and the pushed commit, to the pushed commit,
# which is what a pull request from dev into stage would compare. Pushes to
# stage and main are not reviewed: they only receive what was reviewed before.
on:
  pull_request:
    branches: [main, stage, dev]
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out dev and stage
        # A push has no base commit in its event, so find it in the history.
        if: github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Pick the commits to compare
        id: range
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            base="$PR_BASE_SHA"
            head="$PR_HEAD_SHA"
          else
            # A push to dev: what dev has that stage does not.
            git fetch --no-tags origin stage
            base="$(git merge-base origin/stage "$PUSH_SHA")" || { echo "::error::no common ancestor of stage and $PUSH_SHA to compare dev against"; exit 1; }
            head="$PUSH_SHA"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "Reviewing $base...$head"

      # The review action hard-fails with "Dependency review is not supported
      # on this repository" whenever the repository's Dependency graph setting
      # is off. The graph is required: when it is off, this job fails with the
      # fix spelled out instead of the action's generic error. Nothing ever
      # skips review silently, so any answer but 200 fails closed.
      - name: Check dependency graph availability
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ steps.range.outputs.base }}
          HEAD_SHA: ${{ steps.range.outputs.head }}
        run: |
          api() { # $1 = output file, $2 = API path; prints the HTTP status
            curl --silent --show-error --retry 3 --max-time 30 \
              --output "$1" --write-out '%{http_code}' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/$2" || true
          }

          # Prove the token works on an endpoint it must be able to read, so a
          # broken token is named as such and not blamed on the graph.
          repo_status=$(api "$RUNNER_TEMP/repo.json" "repos/$REPO")
          if [ "$repo_status" != "200" ]; then
            echo "::error::Token cannot read $REPO (HTTP ${repo_status:-none}), so the dependency graph cannot be checked."
            cat "$RUNNER_TEMP/repo.json" 2>/dev/null || true
            exit 1
          fi

          body="$RUNNER_TEMP/dependency-graph.json"
          status=$(api "$body" "repos/$REPO/dependency-graph/compare/$BASE_SHA...$HEAD_SHA")
          if [ "$status" != "200" ]; then
            settings="https://github.com/$REPO/settings/security_analysis"
            message="The dependency graph API answered HTTP ${status:-none}, so dependency changes in this run were NOT reviewed. The usual cause of a 403 is the repository's Dependency graph setting being off: enable it at $settings and re-run this job."
            echo "::error title=Dependency review failed::$message"
            {
              echo "### Dependency review failed"
              echo
              echo "$message"
            } >> "$GITHUB_STEP_SUMMARY"
            cat "$body" 2>/dev/null || true
            exit 1
          fi

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # The action requires both refs outside a pull request. For a pull
          # request they are the very commits it would take from the event.
          base-ref: ${{ steps.range.outputs.base }}
          head-ref: ${{ steps.range.outputs.head }}
          fail-on-severity: high
          fail-on-scopes: runtime, development, unknown
