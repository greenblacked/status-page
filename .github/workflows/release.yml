name: Release

# Publishes a GitHub Release whose notes are that version's CHANGELOG.md
# section, and creates its vX.Y.Z tag. Only main is released: pull requests
# merge into dev, which never releases, the owner promotes dev to stage (a
# preview) and stage to main, each in a merge commit
# (CONTRIBUTING.md#releases). Ways in:
#   - Merging a pull request into main. The Conventional Commits merged since
#     the last release pick the next version (scripts/release/next.sh): a
#     breaking change is major, feat minor, fix, perf or revert patch, and
#     anything else releases nothing. CI commits the bump to main, authored
#     by whoever merged, then tags it and publishes. The usual way to release.
#   - Merging a pull request that sets an untagged version in package.json,
#     for example one from scripts/release/bump.sh: releases that version.
#   - Run workflow with bump = patch, minor or major: the same bump, by hand.
#   - Run workflow with bump = current: publishes the package.json version as
#     it is, if it has no tag yet (a retry).
#   - Run workflow with version and commit: backfills an older release by
#     tagging that commit on main with a version that already has a
#     CHANGELOG.md section on main.
#   - Pushing a vX.Y.Z tag by hand.
# The release has to be on main, have a changelog section and pass the same
# checks as CI. If any check fails, nothing is committed, tagged or
# published. After every run for main, released or not, main is merged back
# into stage and then dev, so both carry the release commit and any fix
# merged into main directly. Those merges are pushed with GITHUB_TOKEN, which
# starts no workflow of its own, so when one actually moved stage this also
# starts deploy.yml on stage by hand, or the stage preview would keep running
# the pre-release code until an unrelated push to stage updated it (dev
# deploys nothing). CONTRIBUTING.md#releases has the details.

on:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      bump:
        description: 'patch, minor or major bumps the version and releases it; current releases the package.json version as it is'
        type: choice
        options: [current, patch, minor, major]
        default: current
      version:
        description: 'Backfill only: an older X.Y.Z that has a CHANGELOG.md section on main. Leave empty otherwise.'
        type: string
        default: ''
      commit:
        description: 'Backfill only: the commit on main to tag as that version.'
        type: string
        default: ''

permissions:
  contents: read

# One release at a time. GitHub keeps only the newest pending run, which is
# enough: a merge run plans from main as it is when it starts, so it also
# releases any merge whose own run was dropped.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: plan release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release: ${{ steps.plan.outputs.release }}
      mode: ${{ steps.plan.outputs.mode }}
      level: ${{ steps.plan.outputs.level }}
      tag: ${{ steps.plan.outputs.tag }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history, branches and tags: main ancestry, commit types since
          # the last tag and existing tags are all read below.
          fetch-depth: 0

      - name: Decide whether this run releases
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          BUMP: ${{ inputs.bump }}
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ inputs.commit }}
        run: |
          skip() { echo "::notice::$1"; echo "release=false" >>"$GITHUB_OUTPUT"; exit 0; }
          fail() { echo "::error::$1"; exit 1; }
          out() { echo "$1=$2" >>"$GITHUB_OUTPUT"; }
          version_at() { git show "$1:package.json" | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version"; }
          # The dry-run bump commits below are thrown away with the runner.
          git config user.name plan
          git config user.email plan@localhost

          git merge-base --is-ancestor "$GITHUB_SHA" origin/main ||
            fail "$GITHUB_SHA is not on main; only main is released"

          # Backfill: tag an older commit with a version main's changelog has.
          if [ "$EVENT" = workflow_dispatch ] && [ -n "$VERSION$COMMIT" ]; then
            if [ -z "$VERSION" ] || [ -z "$COMMIT" ]; then
              fail "a backfill needs both version and commit"
            fi
            [ "$BUMP" = current ] || fail "leave bump at current for a backfill"
            [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || fail "'$VERSION' is not a MAJOR.MINOR.PATCH version"
            sha="$(git rev-parse -q --verify "$COMMIT^{commit}")" || fail "no commit $COMMIT"
            git merge-base --is-ancestor "$sha" origin/main || fail "$COMMIT is not on main"
            current="$(version_at origin/main)"
            newest="$(printf '%s\n%s\n' "$VERSION" "$current" | sort -V | tail -n1)"
            if [ "$VERSION" = "$current" ] || [ "$newest" != "$current" ]; then
              fail "a backfill is for versions older than $current; release $current with bump = current"
            fi
            tag="v$VERSION"
            if existing="$(git rev-parse -q --verify "refs/tags/$tag^{commit}")" && [ "$existing" != "$sha" ]; then
              fail "$tag already exists on $existing"
            fi
            git show origin/main:CHANGELOG.md >"$RUNNER_TEMP/CHANGELOG.md"
            CHANGELOG="$RUNNER_TEMP/CHANGELOG.md" ./scripts/ci/release-notes.sh "$VERSION" >/dev/null
            out mode backfill; out tag "$tag"; out sha "$sha"; out release true
            exit 0
          fi

          # Run workflow with a bump: a dry run of the commit publish will make.
          if [ "$EVENT" = workflow_dispatch ] && [ "$BUMP" != current ]; then
            out sha "$(git rev-parse HEAD)"
            ./scripts/release/bump.sh --ci "$BUMP"
            out mode bump; out level "$BUMP"; out tag "v$(node -p "require('./package.json').version")"; out release true
            exit 0
          fi

          # A merge to main. Plan from main as it is now, not only this push:
          # a newer merge may already be there, and its run may have been
          # dropped from the queue (see concurrency).
          if [ "$EVENT" = push ] && [ "$REF_TYPE" = branch ]; then
            head="$(git rev-parse origin/main)"
            tag="v$(version_at "$head")"
            out sha "$head"
            git checkout --quiet --detach "$head"
            if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              # The merge set a new version (bump.sh), or that version's
              # release never published: release it as it is.
              ./scripts/ci/release-notes.sh "${tag#v}" >/dev/null
              out mode current; out tag "$tag"; out release true
              exit 0
            fi
            level="$(./scripts/release/next.sh level "$tag..HEAD")"
            [ "$level" != none ] || skip "no feat, fix or breaking change since $tag; nothing to release"
            ./scripts/release/next.sh notes "$tag..HEAD" >"$RUNNER_TEMP/fallback-notes.md"
            ./scripts/release/bump.sh --ci --fallback-notes "$RUNNER_TEMP/fallback-notes.md" "$level"
            out mode auto; out level "$level"; out tag "v$(node -p "require('./package.json').version")"; out release true
            exit 0
          fi

          # Run workflow with bump = current, or a tag pushed by hand.
          version="$(node -p "require('./package.json').version")"
          tag="v$version"
          if [ "$REF_TYPE" = tag ] && [ "$REF_NAME" != "$tag" ]; then
            fail "tag $REF_NAME does not match package.json version $version"
          fi
          if existing="$(git rev-parse -q --verify "refs/tags/$tag^{commit}")" && [ "$existing" != "$GITHUB_SHA" ]; then
            fail "$tag already exists on $existing; run this workflow with bump = patch, minor or major"
          fi
          ./scripts/ci/release-notes.sh "$version" >/dev/null
          out mode current; out tag "$tag"; out sha "$GITHUB_SHA"; out release true

  verify:
    name: verify release
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Everything this job runs from this repository before the commit being
      # released is checked out: the npm pin (its script, the signature check
      # that script runs, the lockfile, packageManager) and .nvmrc, all from
      # the commit that started this run. A backfill releases an older commit,
      # which may predate scripts/ci/npm-pin.sh, scripts/ci/audit-signatures.sh
      # and tools/npm, so the pin cannot come from that checkout. Only these
      # files. Every script npm-pin.sh runs must be listed (a unit test
      # checks). It goes first, into the workspace root, because a later
      # checkout into the root would delete it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          sparse-checkout: |
            /.nvmrc
            /package.json
            /scripts/ci/npm-pin.sh
            /scripts/ci/audit-signatures.sh
            /tools/npm/
          sparse-checkout-cone-mode: false
      # No package cache: a cache entry saved by any other run could reach
      # the code that gets tagged. A release is rare; a cold install is fine.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      # npm at the packageManager version, from a lockfile that records its
      # hash (tools/npm), not installed by name. No install scripts.
      - name: Pin npm
        run: ./scripts/ci/npm-pin.sh install
      - name: Check npm
        run: ./scripts/ci/npm-pin.sh verify
      # The code being released, last and into release/: before any bump
      # commit, which changes only the version and the changelog. After this
      # step the job runs only the project's own npm commands: no script of
      # this run's commit and no cache action, so nothing it does can be saved
      # into a cache the default branch reads (CodeQL: cache poisoning).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.sha }}
          path: release
      # The pinned npm should be the one the release commit itself names.
      - name: Check the npm pin matches the release
        run: |
          release="$(node -p "require('./release/package.json').packageManager")"
          pinned="$(node -p "require('./package.json').packageManager")"
          if [ "$release" != "$pinned" ]; then
            echo "::error::the commit being released names $release, but the npm pin in this run's commit is $pinned; backfill from a ref whose packageManager matches"
            exit 1
          fi
      - run: npm ci
        working-directory: release
      - run: npm run typecheck
        working-directory: release
      - run: npm test
        working-directory: release
      - run: npm run build
        working-directory: release

  publish:
    name: publish release
    needs: [plan, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The only job with write access. It installs no dependencies and runs
    # no project code: only the release scripts, npm version and gh.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # A backfill tags an older commit but takes its scripts and notes
          # from main, where its changelog section is. Everything else works
          # on the commit plan chose.
          ref: ${{ needs.plan.outputs.mode == 'backfill' && github.sha || needs.plan.outputs.sha }}
          # Kept only when this job has a bump commit to push to main.
          persist-credentials: ${{ needs.plan.outputs.mode == 'bump' || needs.plan.outputs.mode == 'auto' }}

      - name: Commit the version bump to main
        id: bump
        if: needs.plan.outputs.mode == 'bump' || needs.plan.outputs.mode == 'auto'
        env:
          MODE: ${{ needs.plan.outputs.mode }}
          LEVEL: ${{ needs.plan.outputs.level }}
          TAG: ${{ needs.plan.outputs.tag }}
          SHA: ${{ needs.plan.outputs.sha }}
          ACTOR: ${{ github.actor }}
          ACTOR_ID: ${{ github.actor_id }}
        run: |
          # A merge run whose main moved on hands over to the newer push's
          # run, which plans from the newer main and releases these commits
          # too. A run started by hand fails instead, so it can be re-run.
          moved() {
            if [ "$MODE" = auto ]; then
              echo "::notice::main moved after this run planned; the run for the newer push releases these changes"
              echo "published=false" >>"$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::main moved after this run started; run it again"
            exit 1
          }
          [ "$(git rev-parse origin/main)" = "$SHA" ] || moved

          # Authored by the account that merged or ran the workflow, not a bot.
          git config user.name "$ACTOR"
          git config user.email "$ACTOR_ID+$ACTOR@users.noreply.github.com"
          fallback=()
          if [ "$MODE" = auto ]; then
            notes="$RUNNER_TEMP/fallback-notes.md"
            ./scripts/release/next.sh notes "v$(node -p "require('./package.json').version")..HEAD" >"$notes"
            fallback=(--fallback-notes "$notes")
          fi
          ./scripts/release/bump.sh --ci "${fallback[@]}" "$LEVEL"
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::bumped to v$version, but plan expected $TAG"
            exit 1
          fi
          # Fails without force if main moved since the checks above, so a
          # concurrent merge is never overwritten.
          git push origin "HEAD:refs/heads/main" || moved

      - name: Tag and publish the GitHub Release
        if: steps.bump.outputs.published != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MODE: ${{ needs.plan.outputs.mode }}
          TAG: ${{ needs.plan.outputs.tag }}
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          ./scripts/ci/release-notes.sh "${TAG#v}" >"$notes"
          # The bump commit, or the commit this run was started for. A
          # backfill tags the older commit plan checked.
          target="$(git rev-parse HEAD)"
          if [ "$MODE" = backfill ]; then
            target="$SHA"
          fi
          # Only the newest version is Latest, so a backfill never takes the
          # badge from a newer release.
          latest=false
          if [ "$( { git tag --list 'v*.*.*'; echo "$TAG"; } | sort -V | tail -n1)" = "$TAG" ]; then
            latest=true
          fi
          # A re-run updates the existing release instead of failing on it.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Status Page $TAG" --notes-file "$notes" --latest="$latest"
          else
            # Creates the tag on target. A tag pushed by hand already points
            # there and is used as it is. Neither the tag nor a bump pushed
            # with GITHUB_TOKEN starts this workflow again.
            gh release create "$TAG" --target "$target" --title "Status Page $TAG" --notes-file "$notes" --latest="$latest"
          fi

  sync-branches:
    name: merge main into stage and dev
    needs: [plan, verify, publish]
    # After every push to main or bump run that did not fail, released or not.
    # A backfill or a tag pushed by hand leaves main as it was.
    if: >-
      always()
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
      && github.ref_type == 'branch'
      && needs.plan.outputs.mode != 'backfill'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      stage_pushed: ${{ steps.merge.outputs.stage_pushed }}
    steps:
      # Keeps the token: this job pushes the merges to stage and dev.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]
        with:
          fetch-depth: 0
          ref: main

      - name: Merge main into stage and dev
        id: merge
        env:
          ACTOR: ${{ github.actor }}
          ACTOR_ID: ${{ github.actor_id }}
        run: |
          # GITHUB_TOKEN pushes below start no workflow (deploy.yml included),
          # so this output tells the redeploy-stage job whether stage's tip
          # actually moved and the stage preview needs waking up by hand. dev
          # deploys nothing, so its push needs no follow-up.
          failed=0
          git config user.name "$ACTOR"
          git config user.email "$ACTOR_ID+$ACTOR@users.noreply.github.com"
          # main's copy: a branch's own may predate it.
          merge_changelog="$RUNNER_TEMP/merge-changelog.sh"
          cp scripts/release/merge-changelog.sh "$merge_changelog"

          # stage first, then dev. A problem that stops one branch does not
          # stop the other, but fails the job at the end. The script runs under
          # bash -e, so the steps that can fail for reasons outside the merge
          # (network, checkout) are guarded: a failure sets failed=1 instead of
          # ending the script, and stage_pushed is written the moment stage's
          # push succeeds, before dev is touched.
          for branch in stage dev; do
            listed=0
            git ls-remote --exit-code --heads origin "$branch" >/dev/null || listed=$?
            if [ "$listed" = 2 ]; then
              echo "::notice::no $branch branch; nothing to sync"
              continue
            elif [ "$listed" != 0 ]; then
              echo "::error::could not look up $branch on origin; re-run this job"
              failed=1
              continue
            fi
            synced=false
            # A pull request merged into the branch meanwhile rejects the
            # push; fetch and merge again rather than fail the release run.
            for attempt in 1 2 3; do
              if ! git fetch --quiet origin "$branch"; then
                echo "::error::could not fetch $branch; re-run this job"
                failed=1
                synced=true
                break
              fi
              if git merge-base --is-ancestor origin/main "origin/$branch"; then
                echo "::notice::$branch already has everything on main"
                synced=true
                break
              fi
              if ! git checkout --quiet -B "$branch" "origin/$branch"; then
                echo "::error::could not check out $branch; re-run this job"
                failed=1
                synced=true
                break
              fi
              # A plain merge, never a rebase or force-push: the branch is shared.
              if ! git merge --no-edit -m "Merge branch 'main' into $branch" origin/main; then
                # A release on main while the branch has Unreleased lines
                # conflicts on CHANGELOG.md alone. merge-changelog.sh resolves
                # exactly that case and refuses anything else.
                if [ "$(git diff --name-only --diff-filter=U)" = CHANGELOG.md ] &&
                  "$merge_changelog" <(git show :1:CHANGELOG.md) <(git show :2:CHANGELOG.md) <(git show :3:CHANGELOG.md) >"$RUNNER_TEMP/CHANGELOG.md" &&
                  cp "$RUNNER_TEMP/CHANGELOG.md" CHANGELOG.md &&
                  git add CHANGELOG.md &&
                  git commit --quiet --no-edit; then
                  echo "::notice::kept main's release in CHANGELOG.md and $branch's lines under Unreleased"
                else
                  git merge --abort
                  echo "::error::main and $branch conflict. Branch from $branch (git switch -c chore/sync-main origin/$branch), run git merge origin/main, resolve, push, and merge a pull request into $branch with a merge commit. Do not resolve it on a pull request from main: that commits $branch's work to main and releases it."
                  failed=1
                  synced=true
                  break
                fi
              fi
              if git push origin "HEAD:refs/heads/$branch"; then
                if [ "$branch" = stage ]; then
                  echo "stage_pushed=true" >>"$GITHUB_OUTPUT"
                fi
                synced=true
                break
              fi
              echo "::warning::$branch moved during the merge (attempt $attempt); trying again"
              git checkout --quiet --detach origin/main || true
            done
            if [ "$synced" = false ]; then
              echo "::error::$branch kept moving; re-run this job"
              failed=1
            fi
            git checkout --quiet --detach origin/main || true
          done
          exit "$failed"

  redeploy-stage:
    name: redeploy stage preview
    needs: sync-branches
    # sync-branches pushes the merge with GITHUB_TOKEN, which starts no
    # workflow (GitHub's own loop guard), so deploy.yml never sees stage move
    # and the stage preview is left running the pre-release code until
    # something else deploys. Only start it when stage's tip actually
    # changed, even if dev's sync failed after it.
    if: ${{ !cancelled() && needs.sync-branches.outputs.stage_pushed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # Only scope beyond the workflow default (contents: read): to start
      # deploy.yml by hand, the same way `gh workflow run` would from a
      # maintainer's machine.
      actions: write
    steps:
      - name: Start deploy.yml on stage
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run deploy.yml --ref stage
