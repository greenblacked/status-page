name: Release

# Creates the vX.Y.Z tag and a draft GitHub Release whose notes are that
# version's CHANGELOG.md section; the sign job attaches the signed source
# archive and only then publishes the release. If a check fails nothing is
# committed, tagged or published; if signing fails the tag exists and the
# release stays a draft. Only main is released: pull requests
# merge into dev, which never releases, the owner promotes dev to stage (a
# preview) and stage to main, each in a merge commit
# (CONTRIBUTING.md#releases). Ways in:
#   - Merging a pull request into main. The Conventional Commits merged since
#     the last release pick the next version (scripts/release/next.sh): a
#     breaking change is major, feat minor, fix, perf or revert patch, and
#     anything else releases nothing. CI commits the bump to main, authored
#     by whoever merged, then tags it and drafts the release. The usual way
#     to release only where GitHub Actions may push to main; here main's
#     ruleset refuses that push, so such a run fails at the bump.
#   - Merging a pull request that sets an untagged version in package.json,
#     for example one from scripts/release/bump.sh: releases that version
#     without pushing to main. This repository releases this way.
#   - Run workflow with bump = patch, minor or major: the same bump, by hand.
#   - Run workflow with bump = current: publishes the package.json version as
#     it is, if it has no tag yet (a retry).
#   - Run workflow with version and commit: backfills an older release by
#     tagging that commit on main with a version that already has a
#     CHANGELOG.md section on main.
#   - Pushing a vX.Y.Z tag by hand.
# The release has to be on main, have a changelog section and pass the same
# checks as CI. After every run for main, released or not, main is merged back
# into stage and then dev (not while dev is paused: scripts/ci/dev-paused), so
# both carry the release commit and any fix merged into main directly. A push
# to main, stage or dev that fails fails the run, naming the cause, unless the
# branch really moved meanwhile (scripts/release/push.sh); a ruleset that
# refuses GitHub Actions' push is the usual cause, and the release then goes
# through bump.sh and a pull request into main (CONTRIBUTING.md#releases).
# Those merges are pushed with GITHUB_TOKEN, which
# starts no workflow of its own, so when one actually moved stage this also
# starts deploy.yml on stage by hand, or the stage preview would keep running
# the pre-release code until an unrelated push to stage updated it (dev
# deploys nothing). CONTRIBUTING.md#releases has the details, and how to
# verify a release.

on:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      bump:
        description: 'patch, minor or major bumps the version and releases it; current releases the package.json version as it is'
        type: choice
        options: [current, patch, minor, major]
        default: current
      version:
        description: 'Backfill only: an older X.Y.Z that has a CHANGELOG.md section on main. Leave empty otherwise.'
        type: string
        default: ''
      commit:
        description: 'Backfill only: the commit on main to tag as that version.'
        type: string
        default: ''

permissions:
  contents: read

# One release at a time. GitHub keeps only the newest pending run, which is
# enough: a merge run plans from main as it is when it starts, so it also
# releases any merge whose own run was dropped.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: plan release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release: ${{ steps.plan.outputs.release }}
      mode: ${{ steps.plan.outputs.mode }}
      level: ${{ steps.plan.outputs.level }}
      tag: ${{ steps.plan.outputs.tag }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history, branches and tags: main ancestry, commit types since
          # the last tag and existing tags are all read below.
          fetch-depth: 0

      - name: Decide whether this run releases
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          BUMP: ${{ inputs.bump }}
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ inputs.commit }}
        run: |
          skip() { echo "::notice::$1"; echo "release=false" >>"$GITHUB_OUTPUT"; exit 0; }
          fail() { echo "::error::$1"; exit 1; }
          out() { echo "$1=$2" >>"$GITHUB_OUTPUT"; }
          version_at() { git show "$1:package.json" | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version"; }
          # The dry-run bump commits below are thrown away with the runner.
          git config user.name plan
          git config user.email plan@localhost

          git merge-base --is-ancestor "$GITHUB_SHA" origin/main ||
            fail "$GITHUB_SHA is not on main; only main is released"

          # Run workflow from any other ref (stage can sit on main's tip) would
          # publish, but the sign job's certificate would name that ref and
          # fail its own check, leaving a release without signed assets.
          if [ "$EVENT" = workflow_dispatch ]; then
            [[ "$REF" =~ ^refs/(heads/main|tags/v[0-9]+\.[0-9]+\.[0-9]+)$ ]] ||
              fail "run this workflow from main or a vX.Y.Z tag, not $REF"
          fi

          # Backfill: tag an older commit with a version main's changelog has.
          if [ "$EVENT" = workflow_dispatch ] && [ -n "$VERSION$COMMIT" ]; then
            if [ -z "$VERSION" ] || [ -z "$COMMIT" ]; then
              fail "a backfill needs both version and commit"
            fi
            [ "$BUMP" = current ] || fail "leave bump at current for a backfill"
            [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || fail "'$VERSION' is not a MAJOR.MINOR.PATCH version"
            sha="$(git rev-parse -q --verify "$COMMIT^{commit}")" || fail "no commit $COMMIT"
            git merge-base --is-ancestor "$sha" origin/main || fail "$COMMIT is not on main"
            current="$(version_at origin/main)"
            newest="$(printf '%s\n%s\n' "$VERSION" "$current" | sort -V | tail -n1)"
            if [ "$VERSION" = "$current" ] || [ "$newest" != "$current" ]; then
              fail "a backfill is for versions older than $current; release $current with bump = current"
            fi
            tag="v$VERSION"
            if existing="$(git rev-parse -q --verify "refs/tags/$tag^{commit}")" && [ "$existing" != "$sha" ]; then
              fail "$tag already exists on $existing"
            fi
            git show origin/main:CHANGELOG.md >"$RUNNER_TEMP/CHANGELOG.md"
            CHANGELOG="$RUNNER_TEMP/CHANGELOG.md" ./scripts/ci/release-notes.sh "$VERSION" >/dev/null
            out mode backfill; out tag "$tag"; out sha "$sha"; out release true
            exit 0
          fi

          # Run workflow with a bump: a dry run of the commit publish will make.
          if [ "$EVENT" = workflow_dispatch ] && [ "$BUMP" != current ]; then
            out sha "$(git rev-parse HEAD)"
            ./scripts/release/bump.sh --ci "$BUMP"
            out mode bump; out level "$BUMP"; out tag "v$(node -p "require('./package.json').version")"; out release true
            exit 0
          fi

          # A merge to main. Plan from main as it is now, not only this push:
          # a newer merge may already be there, and its run may have been
          # dropped from the queue (see concurrency).
          if [ "$EVENT" = push ] && [ "$REF_TYPE" = branch ]; then
            head="$(git rev-parse origin/main)"
            tag="v$(version_at "$head")"
            out sha "$head"
            git checkout --quiet --detach "$head"
            if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              # The merge set a new version (bump.sh), or that version's
              # release never published: release it as it is.
              ./scripts/ci/release-notes.sh "${tag#v}" >/dev/null
              out mode current; out tag "$tag"; out release true
              exit 0
            fi
            level="$(./scripts/release/next.sh level "$tag..HEAD")"
            [ "$level" != none ] || skip "no feat, fix or breaking change since $tag; nothing to release"
            ./scripts/release/next.sh notes "$tag..HEAD" >"$RUNNER_TEMP/fallback-notes.md"
            ./scripts/release/bump.sh --ci --fallback-notes "$RUNNER_TEMP/fallback-notes.md" "$level"
            out mode auto; out level "$level"; out tag "v$(node -p "require('./package.json').version")"; out release true
            exit 0
          fi

          # Run workflow with bump = current, or a tag pushed by hand.
          version="$(node -p "require('./package.json').version")"
          tag="v$version"
          if [ "$REF_TYPE" = tag ] && [ "$REF_NAME" != "$tag" ]; then
            fail "tag $REF_NAME does not match package.json version $version"
          fi
          if existing="$(git rev-parse -q --verify "refs/tags/$tag^{commit}")" && [ "$existing" != "$GITHUB_SHA" ]; then
            fail "$tag already exists on $existing; run this workflow with bump = patch, minor or major"
          fi
          ./scripts/ci/release-notes.sh "$version" >/dev/null
          out mode current; out tag "$tag"; out sha "$GITHUB_SHA"; out release true

  verify:
    name: verify release
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The commit that started this run, in full: its npm pin (npm-pin.sh,
      # the audit-signatures.sh it runs, tools/npm, packageManager) and its
      # .nvmrc. A backfill releases an older commit, which may predate those
      # files, so the pin cannot come from the commit being released. The
      # whole history comes with it (plan checked that the release commit is
      # on main), so that commit is already here and needs no second fetch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      # No package cache: a cache entry saved by any other run could reach
      # the code that gets tagged. A release is rare; a cold install is fine.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      # npm at the packageManager version, from a lockfile that records its
      # hash (tools/npm), not installed by name. No install scripts.
      - name: Pin npm
        run: ./scripts/ci/npm-pin.sh install
      - name: Check npm
        run: ./scripts/ci/npm-pin.sh verify
      # The code being released, last and into release/: before any bump
      # commit, which changes only the version and the changelog. It comes
      # from the history above with git, not from a second actions/checkout
      # of a ref chosen at run time (CodeQL flags that as an untrusted
      # checkout that can poison the default branch's cache, although plan
      # only ever picks a commit already on main). After this step the job
      # runs only the project's own npm commands: no script of this run's
      # commit and no cache action.
      - name: Check out the release commit
        env:
          RELEASE_SHA: ${{ needs.plan.outputs.sha }}
        run: git worktree add --detach release "$RELEASE_SHA"
      # The pinned npm should be the one the release commit itself names.
      - name: Check the npm pin matches the release
        run: |
          release="$(node -p "require('./release/package.json').packageManager")"
          pinned="$(node -p "require('./package.json').packageManager")"
          if [ "$release" != "$pinned" ]; then
            echo "::error::the commit being released names $release, but the npm pin in this run's commit is $pinned; backfill from a ref whose packageManager matches"
            exit 1
          fi
      - run: npm ci
        working-directory: release
      - run: npm run typecheck
        working-directory: release
      - run: npm test
        working-directory: release
      - run: npm run build
        working-directory: release

  publish:
    name: publish release
    needs: [plan, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The only job with write access. It installs no dependencies and runs
    # no project code: only the release scripts, npm version and gh.
    permissions:
      contents: write # push the bump commit and the tag, create the draft GitHub Release
    outputs:
      # false when main moved and the newer push's run releases instead (the
      # bump step says so); true for every other run that got this far.
      published: ${{ steps.bump.outputs.published != 'false' }}
      # The commit the tag names; the sign job checks the tag still does.
      target: ${{ steps.release.outputs.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # A backfill tags an older commit but takes its scripts and notes
          # from main, where its changelog section is. Everything else works
          # on the commit plan chose.
          ref: ${{ needs.plan.outputs.mode == 'backfill' && github.sha || needs.plan.outputs.sha }}
          # Kept only when this job has a bump commit to push to main.
          persist-credentials: ${{ needs.plan.outputs.mode == 'bump' || needs.plan.outputs.mode == 'auto' }}

      - name: Commit the version bump to main
        id: bump
        if: needs.plan.outputs.mode == 'bump' || needs.plan.outputs.mode == 'auto'
        env:
          MODE: ${{ needs.plan.outputs.mode }}
          LEVEL: ${{ needs.plan.outputs.level }}
          TAG: ${{ needs.plan.outputs.tag }}
          SHA: ${{ needs.plan.outputs.sha }}
          ACTOR: ${{ github.actor }}
          ACTOR_ID: ${{ github.actor_id }}
        run: |
          # A merge run whose main moved on hands over to the newer push's
          # run, which plans from the newer main and releases these commits
          # too. A run started by hand fails instead, so it can be re-run.
          moved() {
            if [ "$MODE" = auto ]; then
              echo "::notice::main moved after this run planned; the run for the newer push releases these changes"
              echo "published=false" >>"$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::main moved after this run started; run it again"
            exit 1
          }
          [ "$(git rev-parse origin/main)" = "$SHA" ] || moved

          # Authored by the account that merged or ran the workflow, not a bot.
          git config user.name "$ACTOR"
          git config user.email "$ACTOR_ID+$ACTOR@users.noreply.github.com"
          fallback=()
          if [ "$MODE" = auto ]; then
            notes="$RUNNER_TEMP/fallback-notes.md"
            ./scripts/release/next.sh notes "v$(node -p "require('./package.json').version")..HEAD" >"$notes"
            fallback=(--fallback-notes "$notes")
          fi
          ./scripts/release/bump.sh --ci "${fallback[@]}" "$LEVEL"
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::bumped to v$version, but plan expected $TAG"
            exit 1
          fi
          # Fails without force if main moved since the checks above, so a
          # concurrent merge is never overwritten. push.sh looks main up again
          # after a failed push: only a tip that is no longer $SHA is "moved"
          # (status 10). Any other failure, a ruleset rejection (GH013)
          # included, fails the run with its cause, because nothing was
          # released and a green run would hide that.
          pushed=0
          ./scripts/release/push.sh main "$SHA" || pushed=$?
          if [ "$pushed" = 10 ]; then
            moved
          elif [ "$pushed" != 0 ]; then
            exit 1
          fi

      - name: Tag and draft the GitHub Release
        id: release
        if: steps.bump.outputs.published != 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MODE: ${{ needs.plan.outputs.mode }}
          TAG: ${{ needs.plan.outputs.tag }}
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          # The bump commit, or the commit this run was started for. A
          # backfill tags the older commit plan checked.
          target="$(git rev-parse HEAD)"
          if [ "$MODE" = backfill ]; then
            target="$SHA"
          fi
          echo "target=$target" >>"$GITHUB_OUTPUT"
          notes="$RUNNER_TEMP/release-notes.md"
          ./scripts/ci/release-notes.sh "${TAG#v}" >"$notes"

          # The tag comes first and is created before the draft, so a draft
          # never exists without it. Runs are serialized and the checkout has
          # every tag, so a tag pushed by hand or left by a failed run is
          # seen here: it is used as it is if it names target. Neither it nor
          # a bump pushed with GITHUB_TOKEN starts this workflow again.
          if existing="$(git rev-parse -q --verify "refs/tags/$TAG^{commit}")"; then
            [ "$existing" = "$target" ] || { echo "::error::$TAG is on $existing, not $target"; exit 1; }
          else
            # A ruleset on tags can reject this as it does a push to main:
            # name the cause instead of leaving gh's bare message.
            created=0
            out="$(gh api "repos/$GH_REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$target" 2>&1)" || created=$?
            if [ "$created" != 0 ]; then
              printf '%s\n' "$out" >&2
              ./scripts/release/explain-failure.sh "creating tag $TAG" "$TAG" <<<"$out"
              exit 1
            fi
          fi

          # The release for this tag, a draft included (the releases list has
          # them for a token that can write). A re-run updates its notes and
          # leaves it as it is.
          found="$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq '.[] | select(.tag_name == env.TAG) | "\(.id) \(.draft)"')"
          if [ "$(printf '%s' "$found" | grep -c .)" -gt 1 ]; then
            echo "::error::more than one release for $TAG"
            exit 1
          fi
          if [ -z "$found" ]; then
            gh release create "$TAG" --verify-tag --draft --title "Status Page $TAG" --notes-file "$notes"
          else
            gh api -X PATCH "repos/$GH_REPO/releases/${found%% *}" -f name="Status Page $TAG" -F body=@"$notes" >/dev/null
          fi

  sign:
    name: sign release
    needs: [plan, publish]
    if: needs.publish.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The only job in this workflow with id-token: write, and it runs no
    # project code: git, cosign and gh. contents: write is for uploading the
    # two release assets and publishing the draft.
    permissions:
      contents: write # upload the source archive and its signature, publish the release
      id-token: write # keyless Sigstore signing with this run's GitHub OIDC identity
    steps:
      # The tag publish created (or the one pushed by hand): the archive is
      # exactly the commit the release names.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: refs/tags/${{ needs.plan.outputs.tag }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Scorecard's Signed-Releases check looks for a signature asset on the
      # release (*.sigstore.json is one it accepts); users verify the archive
      # with it (CONTRIBUTING.md#releases).
      - name: Archive and sign the source
        shell: bash
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          TARGET: ${{ needs.publish.outputs.target }}
          REPO: ${{ github.repository }}
        run: |
          # A tag moved by hand since publish created it is not signed.
          [ "$(git rev-parse HEAD)" = "$TARGET" ] || { echo "::error::$TAG is on $(git rev-parse HEAD), not $TARGET"; exit 1; }
          mkdir -p "$RUNNER_TEMP/assets"
          archive="$RUNNER_TEMP/assets/status-page-${TAG}.tar.gz"
          git archive --format=tar.gz --prefix="status-page-${TAG#v}/" -o "$archive" HEAD
          cosign sign-blob --yes --bundle "$archive.sigstore.json" "$archive"
          # A bad or mismatched signature fails the run before anything is
          # attached. The identity is this repository's release workflow on
          # main, or on a version tag pushed by hand, issued by GitHub Actions.
          repo_re="${REPO//./\\.}"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "^https://github\.com/${repo_re}/\.github/workflows/release\.yml@refs/(heads/main|tags/v[0-9]+\.[0-9]+\.[0-9]+)$" \
            "$archive"

      - name: Attach them and publish the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          archive="$RUNNER_TEMP/assets/status-page-${TAG}.tar.gz"
          bundle="$archive.sigstore.json"
          found="$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq '.[] | select(.tag_name == env.TAG) | "\(.id) \(.draft)"')"
          if [ "$(printf '%s' "$found" | grep -c .)" -ne 1 ]; then
            echo "::error::expected exactly one release for $TAG, found: ${found:-none}"
            exit 1
          fi
          id="${found%% *}"

          # Already public (an older run's sign re-run, or a release made
          # before signing or by hand): never --clobber here, which deletes a
          # public asset before replacing it. An asset already there is
          # checked, not trusted by its name: a different archive under the
          # expected name (a renamed source tarball, or another version's
          # signed pair) would leave users with the wrong source. Any
          # mismatch fails the run and
          # changes nothing; only the asset that is absent is uploaded.
          if [ "${found##* }" = false ]; then
            have="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
            has_archive=false
            has_bundle=false
            printf '%s\n' "$have" | grep -qxF "$(basename "$archive")" && has_archive=true
            printf '%s\n' "$have" | grep -qxF "$(basename "$bundle")" && has_bundle=true
            repo_re="${GH_REPO//./\\.}"
            verify() { # verify <bundle> <archive>
              cosign verify-blob \
                --bundle "$1" \
                --certificate-oidc-issuer https://token.actions.githubusercontent.com \
                --certificate-identity-regexp "^https://github\.com/${repo_re}/\.github/workflows/release\.yml@refs/(heads/main|tags/v[0-9]+\.[0-9]+\.[0-9]+)$" \
                "$2"
            }
            # A valid signature only says some release run signed these
            # bytes, and the identity matches every version. Tie the archive
            # to this tag too: the same bytes as the fresh archive, or else
            # the commit id git archive records in the tar header is this
            # tag's commit and every entry sits under this version's prefix.
            # The second route does not depend on gzip producing the same
            # bytes, so releases signed on older runner images still pass.
            is_this_source() { # is_this_source <archive>
              [ "$(sha256sum <"$1" | cut -d' ' -f1)" = "$(sha256sum <"$archive" | cut -d' ' -f1)" ] && return 0
              [ "$(gzip -dc "$1" | git get-tar-commit-id)" = "$(git rev-parse HEAD)" ] || return 1
              entries="$(tar -tzf "$1")" || return 1
              printf '%s\n' "$entries" | awk -v p="status-page-${TAG#v}/" 'index($0, p) != 1 { bad = 1 } END { exit (NR == 0 || bad) }'
            }
            existing="$RUNNER_TEMP/existing"
            rm -rf "$existing"
            mkdir -p "$existing"
            if [ "$has_archive" = true ] && [ "$has_bundle" = true ]; then
              gh release download "$TAG" --dir "$existing" --pattern "$(basename "$archive")" --pattern "$(basename "$bundle")"
              if ! verify "$existing/$(basename "$bundle")" "$existing/$(basename "$archive")"; then
                echo "::error::$TAG is public, but its archive and signature bundle do not verify; not replacing public assets"
                exit 1
              fi
              if ! is_this_source "$existing/$(basename "$archive")"; then
                echo "::error::$TAG is public with a signed archive that is not this tag's source; not replacing public assets"
                exit 1
              fi
              echo "::notice::$TAG is already public with its signed assets, which verify"
            elif [ "$has_archive" = true ]; then
              gh release download "$TAG" --dir "$existing" --pattern "$(basename "$archive")"
              # The bundle uploaded below signs the fresh archive, so only
              # the same bytes will do here.
              if [ "$(sha256sum <"$existing/$(basename "$archive")" | cut -d' ' -f1)" != "$(sha256sum <"$archive" | cut -d' ' -f1)" ]; then
                echo "::error::$TAG is public with an archive that is not this tag's source; not signing it"
                exit 1
              fi
              gh release upload "$TAG" "$bundle"
            elif [ "$has_bundle" = true ]; then
              gh release download "$TAG" --dir "$existing" --pattern "$(basename "$bundle")"
              if ! verify "$existing/$(basename "$bundle")" "$archive"; then
                echo "::error::$TAG is public with a signature bundle that does not verify this tag's source; not replacing it"
                exit 1
              fi
              gh release upload "$TAG" "$archive"
            else
              gh release upload "$TAG" "$archive" "$bundle"
            fi
            exit 0
          fi

          # Still a draft: the assets replace any left by a failed attempt,
          # then it goes public. Latest is the newest published version as
          # of now, so a backfill or a late re-run never takes the badge.
          gh release upload "$TAG" "$archive" "$bundle" --clobber
          newest="$( { gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq '.[] | select(.draft | not) | .tag_name'; echo "$TAG"; } | awk '/^v[0-9]+\.[0-9]+\.[0-9]+$/' | sort -V | tail -n1)"
          latest=false
          if [ "$newest" = "$TAG" ]; then
            latest=true
          fi
          gh api -X PATCH "repos/$GH_REPO/releases/$id" -F draft=false -f make_latest="$latest" >/dev/null

  sync-branches:
    name: merge main into stage and dev
    needs: [plan, verify, publish]
    # After every push to main or bump run that did not fail, released or not.
    # A backfill or a tag pushed by hand leaves main as it was.
    if: >-
      always()
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
      && github.ref_type == 'branch'
      && needs.plan.outputs.mode != 'backfill'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # push the merges of main to stage and dev
    outputs:
      stage_pushed: ${{ steps.merge.outputs.stage_pushed }}
    steps:
      # Keeps the token: this job pushes the merges to stage and dev.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]
        with:
          fetch-depth: 0
          ref: main

      - name: Merge main into stage and dev
        id: merge
        env:
          ACTOR: ${{ github.actor }}
          ACTOR_ID: ${{ github.actor_id }}
        run: |
          # GITHUB_TOKEN pushes below start no workflow (deploy.yml included),
          # so this output tells the redeploy-stage job whether stage's tip
          # actually moved and the stage preview needs waking up by hand. dev
          # deploys nothing, so its push needs no follow-up.
          failed=0
          git config user.name "$ACTOR"
          git config user.email "$ACTOR_ID+$ACTOR@users.noreply.github.com"
          # main's copy: a branch's own may predate it.
          merge_changelog="$RUNNER_TEMP/merge-changelog.sh"
          cp scripts/release/merge-changelog.sh "$merge_changelog"
          # push.sh (and the explain-failure.sh it runs, found next to it)
          # runs with this job's write token, so it too comes from main, never
          # from the branch checked out below.
          mkdir -p "$RUNNER_TEMP/release"
          cp scripts/release/push.sh scripts/release/explain-failure.sh "$RUNNER_TEMP/release/"

          # stage first, then dev. A problem that stops one branch does not
          # stop the other, but fails the job at the end. The script runs under
          # bash -e, so the steps that can fail for reasons outside the merge
          # (network, checkout) are guarded: a failure sets failed=1 instead of
          # ending the script, and stage_pushed is written the moment stage's
          # push succeeds, before dev is touched.
          # While dev is paused (scripts/ci/dev-paused, the same switch the
          # branch name check reads) nothing lands in it, so merging main
          # would only conflict with its stale history on every release. Read
          # once, while main is checked out.
          dev_paused="$(./scripts/ci/dev-paused.sh)" || { dev_paused=true; failed=1; }
          for branch in stage dev; do
            if [ "$branch" = dev ] && [ "$dev_paused" = true ]; then
              echo "::notice::dev is paused (scripts/ci/dev-paused); not merging main into it. When dev is recreated from stage, set the file to false"
              continue
            fi
            listed=0
            git ls-remote --exit-code --heads origin "$branch" >/dev/null || listed=$?
            if [ "$listed" = 2 ]; then
              echo "::notice::no $branch branch; nothing to sync"
              continue
            elif [ "$listed" != 0 ]; then
              echo "::error::could not look up $branch on origin; re-run this job"
              failed=1
              continue
            fi
            synced=false
            # A pull request merged into the branch meanwhile rejects the
            # push; fetch and merge again rather than fail the release run.
            for attempt in 1 2 3; do
              if ! git fetch --quiet origin "$branch"; then
                echo "::error::could not fetch $branch; re-run this job"
                failed=1
                synced=true
                break
              fi
              if git merge-base --is-ancestor origin/main "origin/$branch"; then
                echo "::notice::$branch already has everything on main"
                synced=true
                break
              fi
              if ! git checkout --quiet -B "$branch" "origin/$branch"; then
                echo "::error::could not check out $branch; re-run this job"
                failed=1
                synced=true
                break
              fi
              # A branch that took changes while the release was open and
              # touched CHANGELOG.md on both sides of the merge base may have
              # its new Unreleased lines inside the released section after a
              # merge that git calls clean. Nothing here can tell, so it only
              # warns; a fast-forward changes nothing on the branch's side.
              changelog_both=false
              base="$(git merge-base origin/main "origin/$branch")" || base=""
              if [ -n "$base" ] &&
                ! git diff --quiet "$base" origin/main -- CHANGELOG.md &&
                ! git diff --quiet "$base" "origin/$branch" -- CHANGELOG.md; then
                changelog_both=true
              fi
              # A plain merge, never a rebase or force-push: the branch is shared.
              if ! git merge --no-edit -m "Merge branch 'main' into $branch" origin/main; then
                # A release on main while the branch has Unreleased lines
                # conflicts on CHANGELOG.md alone. merge-changelog.sh resolves
                # exactly that case and refuses anything else.
                if [ "$(git diff --name-only --diff-filter=U)" = CHANGELOG.md ] &&
                  "$merge_changelog" <(git show :1:CHANGELOG.md) <(git show :2:CHANGELOG.md) <(git show :3:CHANGELOG.md) >"$RUNNER_TEMP/CHANGELOG.md" &&
                  cp "$RUNNER_TEMP/CHANGELOG.md" CHANGELOG.md &&
                  git add CHANGELOG.md &&
                  git commit --quiet --no-edit; then
                  echo "::notice::kept main's release in CHANGELOG.md and $branch's lines under Unreleased"
                else
                  git merge --abort
                  echo "::error::main and $branch conflict. Branch from $branch (git switch -c chore/sync-main origin/$branch), run git merge origin/main, resolve, push, and merge a pull request into $branch with a merge commit. Do not resolve it on a pull request from main: that commits $branch's work to main and releases it."
                  failed=1
                  synced=true
                  break
                fi
              fi
              if [ "$changelog_both" = true ]; then
                echo "::warning::$branch moved while the release was open; check that its CHANGELOG [Unreleased] lines did not land in the released section (CONTRIBUTING.md#releases)"
              fi
              # Only a branch that really moved since the fetch above is
              # worth another attempt (push.sh looks it up again). A push the
              # ruleset or the token rejects fails the job at once, with the
              # cause, instead of looping and calling it "moved".
              pushed=0
              "$RUNNER_TEMP/release/push.sh" "$branch" "$(git rev-parse "origin/$branch")" || pushed=$?
              if [ "$pushed" = 0 ]; then
                if [ "$branch" = stage ]; then
                  echo "stage_pushed=true" >>"$GITHUB_OUTPUT"
                fi
                synced=true
                break
              elif [ "$pushed" != 10 ]; then
                failed=1
                synced=true
                break
              fi
              echo "::warning::$branch moved during the merge (attempt $attempt); trying again"
              git checkout --quiet --detach origin/main || true
            done
            if [ "$synced" = false ]; then
              echo "::error::$branch kept moving; re-run this job"
              failed=1
            fi
            git checkout --quiet --detach origin/main || true
          done
          exit "$failed"

  redeploy-stage:
    name: redeploy stage preview
    needs: sync-branches
    # sync-branches pushes the merge with GITHUB_TOKEN, which starts no
    # workflow (GitHub's own loop guard), so deploy.yml never sees stage move
    # and the stage preview is left running the pre-release code until
    # something else deploys. Only start it when stage's tip actually
    # changed, even if dev's sync failed after it.
    if: ${{ !cancelled() && needs.sync-branches.outputs.stage_pushed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # Only scope beyond the workflow default (contents: read): to start
      # deploy.yml by hand, the same way `gh workflow run` would from a
      # maintainer's machine.
      actions: write # gh workflow run deploy.yml: a GITHUB_TOKEN push starts no workflow
    steps:
      - name: Start deploy.yml on stage
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run deploy.yml --ref stage
