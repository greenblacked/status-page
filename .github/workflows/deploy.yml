name: Deploy

# Builds the board for Cloudflare Workers and ships it with wrangler to one
# Worker, status-page: main deploys it to production (wrangler deploy), stage
# creates or updates a Worker Preview of it named "stage" (wrangler preview),
# served at https://stage.status.szolotov.com and never on production
# traffic. dev, the branch pull requests merge into, deploys nothing: it is
# promoted to stage, and stage to main, by the owner. Pull requests into dev,
# stage and main build and dry-run the deploy with no credentials. A
# production deploy that does not answer its smoke test is rolled back to the
# previous version automatically; a preview that does not answer just fails
# the job, as production is never touched. Run workflow deploys only main or
# stage; any other ref fails at the first step. CONTRIBUTING.md#deploying has
# the setup.
#
# This repository is public, so the Cloudflare API token is guarded in layers:
#   - It is an environment secret. GitHub gives it only to the deploy job,
#     only in the staging or production environment, whose branch rules
#     admit only stage and main. Pull requests, forks included, never get
#     it, and neither does a push to dev.
#   - There is no pull_request_target here: pull request code never runs
#     with secrets or a write token.
#   - The job that holds the token installs with --ignore-scripts, checks
#     every installed package against the registry's signature
#     (scripts/ci/audit-signatures.sh: pnpm audit signatures, and the
#     lockfile's integrity against its signature), runs no build, no package
#     script and no project JavaScript, and only uploads what the build job
#     made, so a compromised dependency's install script never runs beside
#     it. The repository files it runs are shell scripts from the same
#     protected branch as the deploy, each in a step without the token: the
#     pnpm install (scripts/ci/pnpm-pin.sh: Corepack, pinned by the hash in
#     packageManager), the signature check (scripts/ci/audit-signatures.sh,
#     which also runs scripts/ci/lockfile-integrity.ts) and the smoke test
#     (scripts/ci/smoke.sh: bash, curl and jq).
#   - No job restores a package cache: a pnpm store taken from the Actions
#     cache is installed without its files being checked against the
#     lockfile, and these jobs make the Worker or hold the token.
#   - Every job reads the repository and nothing more.

on:
  push:
    branches: [main, stage]
  pull_request:
    branches: [main, stage, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One deploy per branch at a time, never cancelled half way; pull request
  # runs cancel their older runs.
  group: deploy-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  WRANGLER_SEND_METRICS: 'false'

jobs:
  build:
    name: build worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      environment: ${{ steps.target.outputs.environment }}
    steps:
      - name: Pick the environment
        id: target
        # First, before any install, so a run for a ref that cannot deploy
        # fails at once. Branch names are attacker-controlled on a fork PR,
        # so they go through the environment instead of being interpolated.
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            # Built and dry-run only; the deploy job never runs for a pull request.
            case "$BASE_REF" in
              main | stage | dev) echo "environment=none" >>"$GITHUB_OUTPUT" ;;
              *) echo "::error::pull requests into main, stage and dev are built, not $BASE_REF"; exit 1 ;;
            esac
            exit 0
          fi
          # A push, or Run workflow: only the branches main and stage deploy.
          # A tag named like one, or dev, is refused here.
          [ "$REF_TYPE" = branch ] || { echo "::error::only the branches main (production) and stage (staging) deploy, not the $REF_TYPE $REF_NAME"; exit 1; }
          case "$REF_NAME" in
            main) echo "environment=production" >>"$GITHUB_OUTPUT" ;;
            stage) echo "environment=staging" >>"$GITHUB_OUTPUT" ;;
            *) echo "::error::only main (production) and stage (staging) deploy, not $REF_NAME. dev deploys nothing: promote it to stage (CONTRIBUTING.md#branches)"; exit 1 ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          # No package cache. A pnpm store restored from the Actions cache is
          # installed as it is, without its files being checked against the
          # lockfile's integrity, so a poisoned entry would reach the Worker
          # or the job that holds the token. A cold install is a few seconds.
          package-manager-cache: false
      # pnpm at the packageManager version, installed by Corepack, which
      # refuses it unless it matches the sha512 in packageManager. Not
      # installed by name, and no install scripts.
      - name: Pin pnpm
        run: ./scripts/ci/pnpm-pin.sh install
      - name: Check pnpm
        run: ./scripts/ci/pnpm-pin.sh verify

      - run: pnpm install --frozen-lockfile
      # Every installed tarball against the registry's signature, before
      # any of it is built into the Worker (see ci.yml).
      - name: Verify registry signatures
        run: ./scripts/ci/audit-signatures.sh
      - run: pnpm run typecheck
      - run: pnpm test
      # The same build for every branch: what differs is how it is shipped.
      - name: Build for Cloudflare Workers
        env:
          DEPLOY_TARGET: cloudflare
        run: pnpm run build

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: worker
          path: dist/
          # dist/client/.assetsignore keeps wrangler.json out of the assets.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - name: Smoke-test the local Worker
        shell: bash
        env:
          DEPLOY_TARGET: cloudflare
        run: |
          set -uo pipefail
          log_file="${RUNNER_TEMP}/status-page-worker.log"
          setsid pnpm exec vite preview --host 127.0.0.1 --port 4181 --strictPort </dev/null >"$log_file" 2>&1 &
          preview_pid=$!
          cleanup() {
            kill -- -"$preview_pid" 2>/dev/null || true
            wait "$preview_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          if ! ./scripts/ci/smoke.sh http://127.0.0.1:4181 --wait 90; then
            cat "$log_file"
            exit 1
          fi

  dry-run:
    name: dry-run deploy
    needs: build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          # No package cache. A pnpm store restored from the Actions cache is
          # installed as it is, without its files being checked against the
          # lockfile's integrity, so a poisoned entry would reach the Worker
          # or the job that holds the token. A cold install is a few seconds.
          package-manager-cache: false
      # pnpm at the packageManager version, installed by Corepack, which
      # refuses it unless it matches the sha512 in packageManager. Not
      # installed by name, and no install scripts.
      - name: Pin pnpm
        run: ./scripts/ci/pnpm-pin.sh install
      - name: Check pnpm
        run: ./scripts/ci/pnpm-pin.sh verify
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # This install's wrangler is what checks the Worker below, so it is
      # verified too, not only the build job's.
      - name: Verify registry signatures
        run: ./scripts/ci/audit-signatures.sh
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: worker
          path: dist/
      - name: Check the Worker without deploying it
        run: pnpm exec wrangler deploy --dry-run --config dist/server/wrangler.json

  deploy:
    name: deploy
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Install and deploy (or preview) take a few minutes; the smoke test's
    # version wait (up to 2), its retries (under 1), its readiness wait (up
    # to 5) and a rollback's confirmation (up to 2) come on top.
    timeout-minutes: 20
    environment:
      name: ${{ needs.build.outputs.environment }}
      url: ${{ vars.DEPLOY_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          # No package cache. A pnpm store restored from the Actions cache is
          # installed as it is, without its files being checked against the
          # lockfile's integrity, so a poisoned entry would reach the Worker
          # or the job that holds the token. A cold install is a few seconds.
          package-manager-cache: false
      # pnpm at the packageManager version, installed by Corepack, which
      # refuses it unless it matches the sha512 in packageManager. Not
      # installed by name, and no install scripts.
      - name: Pin pnpm
        run: ./scripts/ci/pnpm-pin.sh install
      - name: Check pnpm
        run: ./scripts/ci/pnpm-pin.sh verify
      # No install scripts: nothing but wrangler runs while the token exists.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # And that wrangler is the registry's: this install, not the build
      # job's, is the one that runs beside the token. No token in this step.
      - name: Verify registry signatures
        run: ./scripts/ci/audit-signatures.sh
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: worker
          path: dist/

      - name: Deploy with wrangler
        id: deploy
        # main: the new version takes production traffic.
        if: needs.build.outputs.environment == 'production'
        # Only this step, the preview step and the rollback step see the token.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          # wrangler appends one JSON line per command to this file; the
          # deploy's line carries the new version's id (the same id its
          # "Current Version ID:" log line prints), which the smoke test
          # waits for in X-Worker-Version.
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.jsonl
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::set the CLOUDFLARE_API_TOKEN secret and the CLOUDFLARE_ACCOUNT_ID variable (or secret) on this environment (CONTRIBUTING.md#deploying)"
            exit 1
          fi
          # wrangler uploads the Worker, which serves production at once, and
          # only then updates its triggers (workers.dev, the Custom Domain).
          # A trigger failure, such as a token without Workers Routes or Zone
          # Read on the zone, fails the command with the new version already
          # live, and the smoke test and rollback below never run for it.
          deploy_log="$RUNNER_TEMP/wrangler-deploy.log"
          set -o pipefail
          if ! pnpm exec wrangler deploy --config dist/server/wrangler.json 2>&1 | tee "$deploy_log"; then
            if grep -qE '^Uploaded [^ ]+ \(' "$deploy_log"; then
              echo "::error::wrangler deploy failed after uploading the Worker: the new version is live on production, but its triggers were not fully updated (see the errors above), and it is neither smoke-tested nor rolled back. Check it, and roll back by hand with 'pnpm exec wrangler rollback --name status-page' (CONTRIBUTING.md#rolling-back)"
            fi
            exit 1
          fi
          version_id="$(jq -r 'select(.type == "deploy") | .version_id // empty' "$WRANGLER_OUTPUT_FILE_PATH" 2>/dev/null | tail -n 1)" || version_id=""
          if ! [[ "$version_id" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]; then
            echo "::error::wrangler deploy succeeded but reported no version id in $WRANGLER_OUTPUT_FILE_PATH, so the smoke test cannot tell the new version from the old one. The new version is live and is neither smoke-tested nor rolled back: check it, and roll back by hand if needed (CONTRIBUTING.md#rolling-back)"
            exit 1
          fi
          echo "version_id=$version_id" >>"$GITHUB_OUTPUT"

      - name: Create the stage preview with wrangler
        id: preview
        # stage: a Worker Preview named "stage" of the same Worker, updated in
        # place by every push and never deployed to production traffic. Its
        # settings are the config's previews block (ROBOTS=noindex, so it
        # answers noindex); --ignore-base-config keeps the dashboard's
        # Previews base config out of it, so the file alone decides.
        if: needs.build.outputs.environment == 'staging'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          COMMIT_SHA: ${{ github.sha }}
          # The preview's line ("type":"preview") carries its URLs.
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.jsonl
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::set the CLOUDFLARE_API_TOKEN secret and the CLOUDFLARE_ACCOUNT_ID variable (or secret) on this environment (CONTRIBUTING.md#deploying)"
            exit 1
          fi
          pnpm exec wrangler preview --config dist/server/wrangler.json --name stage --ignore-base-config --message "stage ${COMMIT_SHA:0:7}"
          host_re='[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+'
          preview_url="$(jq -r 'select(.type == "preview") | .preview_urls[0]? // empty' "$WRANGLER_OUTPUT_FILE_PATH" 2>/dev/null | tail -n 1)" || preview_url=""
          if [[ "$preview_url" =~ ^https://$host_re/?$ ]]; then
            echo "::notice::stage preview: $preview_url"
          else
            echo "::warning::wrangler preview reported no preview URL, so the custom preview domain is not live yet (it is published by the first wrangler deploy on main with previews_enabled); production traffic is untouched"
          fi
          deployment_url="$(jq -r 'select(.type == "preview") | .deployment_urls[0]? // empty' "$WRANGLER_OUTPUT_FILE_PATH" 2>/dev/null | tail -n 1)" || deployment_url=""
          if [[ "$deployment_url" =~ ^https://$host_re/?$ ]]; then
            echo "::notice::this deployment: $deployment_url"
          fi

      - name: No DEPLOY_URL set
        if: vars.DEPLOY_URL == ''
        run: echo "::warning::this environment has no DEPLOY_URL variable, so the new version is not smoke-tested and a failed production deploy is not rolled back (CONTRIBUTING.md#deploying)"

      - name: Smoke-test the deployment
        # On stage, DEPLOY_URL is the stage preview's URL. A preview reports no
        # version id to wait for: wrangler prints a preview id and a
        # deployment id, and nothing shows either equals the id in
        # X-Worker-Version. So there is no --expect-version there, and the
        # checks may be answered by the previous deployment for a moment.
        id: smoke-test
        if: vars.DEPLOY_URL != ''
        # The same checks as CI's preview (scripts/ci/smoke.sh: plain bash,
        # curl and jq, no pnpm and no token), plus --require-ready: a deploy
        # whose /readyz is still 503 at the end serves an all-Unknown or
        # old-timestamp board and is rolled back. A new version can take a few seconds to
        # reach every location: --expect-version waits up to --wait for
        # /healthz to come from the version just deployed, then holds every
        # check to it, so the old version can neither pass nor fail the test
        # in its place. --attempts then retries the page, API and feed checks
        # for about half a minute, so a broken one fails fast.
        #
        # A cold isolate collects sources on its first request, so allow
        # time for vendor responses and retries.
        env:
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
          VERSION_ID: ${{ steps.deploy.outputs.version_id }}
        run: |
          expect=()
          if [ -n "$VERSION_ID" ]; then
            expect=(--expect-version "$VERSION_ID")
          fi
          ./scripts/ci/smoke.sh "$DEPLOY_URL" "${expect[@]}" --wait 120 --attempts 3 --require-ready --ready-wait 60

      - name: Preview failed its smoke test
        # A preview takes no production traffic, so there is nothing to roll
        # back; the failed check above already fails the job.
        if: failure() && steps.smoke-test.outcome == 'failure' && needs.build.outputs.environment == 'staging'
        run: echo "::error::the stage preview did not answer the smoke test. Production traffic is untouched; the preview stays as created until the next push to stage replaces it"

      - name: Roll back the failed deployment
        id: rollback
        # Only after a smoke test that actually ran and failed: a build or
        # auth failure earlier leaves nothing new deployed to roll back from.
        # Production only: a preview has no traffic to roll back.
        if: failure() && steps.smoke-test.outcome == 'failure' && needs.build.outputs.environment == 'production'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "::warning::the deploy did not answer the smoke test; rolling back to the previous version"
          # The first deploy to an environment has nothing to roll back to;
          # the job has failed already either way.
          if pnpm exec wrangler rollback --yes --message "Automatic rollback: failed smoke test in run $GITHUB_RUN_ID" --config dist/server/wrangler.json; then
            echo "rolled_back=true" >>"$GITHUB_OUTPUT"
          else
            echo "::warning::rollback failed; with no earlier version (a first deploy), there is nothing to go back to"
          fi
          exit 1

      - name: Confirm the rollback is answering
        # No token. wrangler rollback returning is not the old version
        # answering: wait until /healthz stops naming the failed version. The
        # version rolled back to may predate X-Worker-Version and send none,
        # which counts as not the failed one.
        if: failure() && steps.rollback.outputs.rolled_back == 'true'
        env:
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
          FAILED_VERSION: ${{ steps.deploy.outputs.version_id }}
        run: |
          # Without a trailing slash, as smoke.sh takes it: "https://host/"
          # would otherwise ask for //healthz.
          base="${DEPLOY_URL%/}"
          deadline=$((SECONDS + 120))
          while :; do
            if headers="$(curl --silent --fail --max-time 10 --dump-header - --output /dev/null "$base/healthz")"; then
              answering="$(printf '%s\n' "$headers" | tr -d '\r' | awk -F': *' 'tolower($1) == "x-worker-version" { print $2; exit }')"
              if [ "$answering" != "$FAILED_VERSION" ]; then
                echo "::notice::rolled back: /healthz is answered by ${answering:-a version without X-Worker-Version}, not the failed $FAILED_VERSION"
                exit 0
              fi
            fi
            if ((SECONDS >= deadline)); then
              echo "::error::after 120s /healthz still does not answer 200 from a version other than the failed $FAILED_VERSION; check Workers & Pages -> Deployments (CONTRIBUTING.md#rolling-back)"
              exit 1
            fi
            sleep 5
          done
