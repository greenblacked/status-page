name: Deploy

# Builds the board for Cloudflare Workers and deploys it with wrangler: dev
# to the staging Worker, main to production. Pull requests build and dry-run
# the deploy with no credentials. A deploy that does not answer its smoke
# test is rolled back to the previous version automatically, and the job
# still fails so it is visible. CONTRIBUTING.md#deploying has the setup.
#
# This repository is public, so the Cloudflare API token is guarded in layers:
#   - It is an environment secret. GitHub gives it only to the deploy job,
#     only in the staging or production environment, whose branch rules
#     admit only dev and main. Pull requests, forks included, never get it.
#   - There is no pull_request_target here: pull request code never runs
#     with secrets or a write token.
#   - The job that holds the token installs with --ignore-scripts, checks
#     every installed package against the registry's signature (npm audit
#     signatures), runs no build, no npm script and no project JavaScript,
#     and only uploads what the build job made, so a compromised
#     dependency's install script never runs beside it. The repository
#     files it runs are two shell scripts from the same protected branch
#     as the deploy, each in a step without the token: the signature check
#     (scripts/ci/audit-signatures.sh) and the smoke test
#     (scripts/ci/smoke.sh: bash, curl and jq).
#   - Every job reads the repository and nothing more.

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One deploy per branch at a time, never cancelled half way; pull request
  # runs cancel their older runs.
  group: deploy-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  WRANGLER_SEND_METRICS: 'false'

jobs:
  build:
    name: build worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      environment: ${{ steps.target.outputs.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Pin npm
        run: npm install --global "npm@$(node -p "require('./package.json').packageManager.split('@')[1]")" # zizmor: ignore[adhoc-packages] exact version from packageManager

      - name: Pick the environment
        id: target
        # Branch names are attacker-controlled on a fork PR, so they go
        # through the environment instead of being interpolated.
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          branch="$REF_NAME"
          [ "$EVENT" = pull_request ] && branch="$BASE_REF"
          case "$branch" in
            main) echo "environment=production" >>"$GITHUB_OUTPUT"; echo "cloudflare_env=" >>"$GITHUB_OUTPUT" ;;
            dev) echo "environment=staging" >>"$GITHUB_OUTPUT"; echo "cloudflare_env=staging" >>"$GITHUB_OUTPUT" ;;
            *) echo "::error::only main (production) and dev (staging) deploy, not $branch"; exit 1 ;;
          esac

      - run: npm ci
      # Every installed tarball against the registry's signature, before
      # any of it is built into the Worker (see ci.yml).
      - name: Verify npm registry signatures
        run: ./scripts/ci/audit-signatures.sh
      - run: npm run typecheck
      - run: npm test
      - name: Build for Cloudflare Workers
        env:
          DEPLOY_TARGET: cloudflare
          CLOUDFLARE_ENV: ${{ steps.target.outputs.cloudflare_env }}
        run: npm run build

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: worker
          path: dist/
          # dist/client/.assetsignore keeps wrangler.json out of the assets.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - name: Smoke-test the local Worker
        shell: bash
        env:
          DEPLOY_TARGET: cloudflare
        run: |
          set -uo pipefail
          log_file="${RUNNER_TEMP}/status-page-worker.log"
          setsid npx --no-install vite preview --host 127.0.0.1 --port 4181 --strictPort </dev/null >"$log_file" 2>&1 &
          preview_pid=$!
          cleanup() {
            kill -- -"$preview_pid" 2>/dev/null || true
            wait "$preview_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          if ! ./scripts/ci/smoke.sh http://127.0.0.1:4181 --wait 90; then
            cat "$log_file"
            exit 1
          fi

  dry-run:
    name: dry-run deploy
    needs: build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Pin npm
        run: npm install --global "npm@$(node -p "require('./package.json').packageManager.split('@')[1]")" # zizmor: ignore[adhoc-packages] exact version from packageManager
      - run: npm ci --ignore-scripts
      # This install's wrangler is what checks the Worker below, so it is
      # verified too, not only the build job's.
      - name: Verify npm registry signatures
        run: ./scripts/ci/audit-signatures.sh
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: worker
          path: dist/
      - name: Check the Worker without deploying it
        run: npx --no-install wrangler deploy --dry-run --config dist/server/wrangler.json

  deploy:
    name: deploy
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Install and deploy take a few minutes; the smoke test's version wait
    # (up to 2), its retries (under 1), its readiness wait (up to 5) and a
    # rollback's confirmation (up to 2) come on top.
    timeout-minutes: 20
    environment:
      name: ${{ needs.build.outputs.environment }}
      url: ${{ vars.DEPLOY_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Pin npm
        run: npm install --global "npm@$(node -p "require('./package.json').packageManager.split('@')[1]")" # zizmor: ignore[adhoc-packages] exact version from packageManager
      # No install scripts: nothing but wrangler runs while the token exists.
      - run: npm ci --ignore-scripts
      # And that wrangler is the registry's: this install, not the build
      # job's, is the one that runs beside the token. No token in this step.
      - name: Verify npm registry signatures
        run: ./scripts/ci/audit-signatures.sh
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: worker
          path: dist/

      - name: Deploy with wrangler
        id: deploy
        # Only this step and the rollback step see the token.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          # wrangler appends one JSON line per command to this file; the
          # deploy's line carries the new version's id (the same id its
          # "Current Version ID:" log line prints), which the smoke test
          # waits for in X-Worker-Version.
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.jsonl
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::set the CLOUDFLARE_API_TOKEN secret and the CLOUDFLARE_ACCOUNT_ID variable on this environment (CONTRIBUTING.md#deploying)"
            exit 1
          fi
          npx --no-install wrangler deploy --config dist/server/wrangler.json
          version_id="$(jq -r 'select(.type == "deploy") | .version_id // empty' "$WRANGLER_OUTPUT_FILE_PATH" 2>/dev/null | tail -n 1)" || version_id=""
          if ! [[ "$version_id" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]; then
            echo "::error::wrangler deploy succeeded but reported no version id in $WRANGLER_OUTPUT_FILE_PATH, so the smoke test cannot tell the new version from the old one. The new version is live and is neither smoke-tested nor rolled back: check it, and roll back by hand if needed (CONTRIBUTING.md#rolling-back)"
            exit 1
          fi
          echo "version_id=$version_id" >>"$GITHUB_OUTPUT"

      - name: No DEPLOY_URL set
        if: vars.DEPLOY_URL == ''
        run: echo "::warning::this environment has no DEPLOY_URL variable, so the deploy is not smoke-tested and a failed one is not rolled back (CONTRIBUTING.md#deploying)"

      - name: Smoke-test the deployment
        id: smoke-test
        if: vars.DEPLOY_URL != ''
        # The same checks as CI's preview (scripts/ci/smoke.sh: plain bash,
        # curl and jq, no npm and no token), plus --require-ready: a deploy
        # whose /readyz is still 503 at the end serves an all-Unknown or
        # old-timestamp board and is rolled back. A new version can take a few seconds to
        # reach every location: --expect-version waits up to --wait for
        # /healthz to come from the version just deployed, then holds every
        # check to it, so the old version can neither pass nor fail the test
        # in its place. --attempts then retries the page, API and feed checks
        # for about half a minute, so a broken one fails fast.
        #
        # A cold isolate collects sources on its first request, so allow
        # time for vendor responses and retries.
        env:
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
          VERSION_ID: ${{ steps.deploy.outputs.version_id }}
        run: ./scripts/ci/smoke.sh "$DEPLOY_URL" --expect-version "$VERSION_ID" --wait 120 --attempts 3 --require-ready --ready-wait 60

      - name: Roll back the failed deployment
        id: rollback
        # Only after a smoke test that actually ran and failed: a build or
        # auth failure earlier leaves nothing new deployed to roll back from.
        if: failure() && steps.smoke-test.outcome == 'failure'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "::warning::the deploy did not answer the smoke test; rolling back to the previous version"
          # The first deploy to an environment has nothing to roll back to;
          # the job has failed already either way.
          if npx --no-install wrangler rollback --yes --message "Automatic rollback: failed smoke test in run $GITHUB_RUN_ID" --config dist/server/wrangler.json; then
            echo "rolled_back=true" >>"$GITHUB_OUTPUT"
          else
            echo "::warning::rollback failed; with no earlier version (a first deploy), there is nothing to go back to"
          fi
          exit 1

      - name: Confirm the rollback is answering
        # No token. wrangler rollback returning is not the old version
        # answering: wait until /healthz stops naming the failed version. The
        # version rolled back to may predate X-Worker-Version and send none,
        # which counts as not the failed one.
        if: failure() && steps.rollback.outputs.rolled_back == 'true'
        env:
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
          FAILED_VERSION: ${{ steps.deploy.outputs.version_id }}
        run: |
          # Without a trailing slash, as smoke.sh takes it: "https://host/"
          # would otherwise ask for //healthz.
          base="${DEPLOY_URL%/}"
          deadline=$((SECONDS + 120))
          while :; do
            if headers="$(curl --silent --fail --max-time 10 --dump-header - --output /dev/null "$base/healthz")"; then
              answering="$(printf '%s\n' "$headers" | tr -d '\r' | awk -F': *' 'tolower($1) == "x-worker-version" { print $2; exit }')"
              if [ "$answering" != "$FAILED_VERSION" ]; then
                echo "::notice::rolled back: /healthz is answered by ${answering:-a version without X-Worker-Version}, not the failed $FAILED_VERSION"
                exit 0
              fi
            fi
            if ((SECONDS >= deadline)); then
              echo "::error::after 120s /healthz still does not answer 200 from a version other than the failed $FAILED_VERSION; check Workers & Pages -> Deployments (CONTRIBUTING.md#rolling-back)"
              exit 1
            fi
            sleep 5
          done
