name: Re-run infrastructure failures

# Re-runs the failed jobs of a run, once, when every job that failed or was
# cancelled died for an infrastructure reason before it ran our code: the
# runner was never acquired ("The job was not acquired by Runner of type hosted
# even after multiple attempts"), lost contact or was shut down, or the job
# was cancelled before any step beyond setup. A job that failed in a test,
# build or lint step means no re-run: a real failure stays red.
# scripts/ci/rerun-infra.cjs makes the decision and has the details.
#
# workflow_run is privileged: it holds a write token even when the run that
# triggered it came from a fork. So this job never checks out or executes code
# from the pull request. It checks out only the default branch, sparsely, for
# the decision script, and everything else is GitHub API reads plus one request
# to re-run the failed jobs of the run.
#
# The re-run is attempt 2, and a run on attempt 2 is never re-run again, so a
# run that keeps failing ends red. A run that a newer push replaced is left
# alone. workflow_run fires only for workflow files on the default branch, so
# this starts working once it is merged to main.

on:
  workflow_run: # zizmor: ignore[dangerous-triggers] never checks out or runs PR code, see above
    workflows: [CI, CodeQL, Dependency review, Deploy, PR title]
    types: [completed]

permissions: {}

concurrency:
  # One decision per run; the script reads the whole run from the API, so a
  # decision dropped by the queue loses nothing a later event would not redo.
  group: rerun-infra-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  rerun:
    if: >-
      github.event.workflow_run.run_attempt == 1 &&
      (github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write # the one write: re-run the failed jobs of a run
      checks: read # the annotations that say why a job ended
      contents: read # the decision script, from the default branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Trusted code only: the default branch, never the run's head.
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: scripts/ci
          persist-credentials: false

      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { rerunInfra } = require(`${process.env.GITHUB_WORKSPACE}/scripts/ci/rerun-infra.cjs`);
            await rerunInfra({ github, context, core });
