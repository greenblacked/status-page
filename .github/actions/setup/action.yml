name: Set up Node and dependencies
description: >
  Node from .nvmrc (or the version given), npm pinned to package.json's
  packageManager, then `npm ci` and a registry signature check. The one
  place every CI job gets its toolchain, so the jobs cannot drift apart.
  Check out the repository before using it.

inputs:
  node-version:
    description: A Node version such as 24. Empty means the exact version in .nvmrc.
    required: false
    default: ''
  install:
    description: Run `npm ci` and `npm audit signatures`. `false` sets up the toolchain only.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: ${{ inputs.node-version == '' && '.nvmrc' || '' }}
        node-version: ${{ inputs.node-version }}
        cache: npm

    # npm is pinned to the exact version package.json names, installed from
    # tools/npm's lockfile, which records the tarball's hash, so this is as
    # reproducible as the root lockfile itself.
    - name: Pin npm
      shell: bash
      run: ./scripts/ci/npm-pin.sh install

    - name: Check the declared toolchain
      shell: bash
      env:
        WANT_NODE: ${{ inputs.node-version }}
      run: |
        want_npm="$(node -p "require('./package.json').packageManager.split('@')[1]")"
        if [ -z "$WANT_NODE" ]; then
          test "$(node --version)" = "v$(cat .nvmrc)" || { echo "::error::expected Node $(cat .nvmrc), got $(node --version)"; exit 1; }
        else
          case "$(node --version)" in "v$WANT_NODE".*) ;; *) echo "::error::expected Node $WANT_NODE, got $(node --version)"; exit 1 ;; esac
        fi
        test "$(npm --version)" = "$want_npm" || { echo "::error::expected npm $want_npm, got $(npm --version)"; exit 1; }
        echo "Node $(node --version), npm $(npm --version)"

    - name: Install dependencies (npm ci)
      if: inputs.install == 'true'
      shell: bash
      run: npm ci

    # Checks every installed tarball against the registry's signature (and
    # provenance attestation, where one is published), so a package altered
    # in a cache or on the way in fails before it is tested or built.
    - name: Verify npm registry signatures
      if: inputs.install == 'true'
      shell: bash
      run: ./scripts/ci/audit-signatures.sh
