<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  The machine's own fonts without Inter, for the Chromium the browser tests start on Linux (chromiumEnv in
  chromium-args.ts points FONTCONFIG_FILE here). A host with Inter installed often maps system-ui and -apple-system
  to it, so the headline is drawn in the host's Inter before the page's self-hosted Inter is ever requested, and the
  tests of the late and the cached Inter, and of the fallback faces, measure the wrong font. Web fonts do not go
  through fontconfig, so the page's own Inter is untouched, and the fallback faces' fonts (Liberation, DejaVu) stay.
  A glob must be an absolute path (one starting with "*" matches nothing) and has no character classes, and "*"
  also matches "/": these drop the files named Inter*, the files in a directory named inter (Debian's
  fonts-inter) and the lower-case inter-* files.
-->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <selectfont>
    <rejectfont>
      <glob>/*/Inter*</glob>
      <glob>/*/inter/*</glob>
      <glob>/*/inter-*</glob>
    </rejectfont>
  </selectfont>
</fontconfig>
