<!doctype html>
<!--
  Source for public/og.jpg, the 1200x630 link-preview image.
  Paper, the name, one question, and the twenty-one services as twenty-one
  outline marks. No live status, so a preview never shows a stale outage. Colours, the
  type and the mark come from src/styles.css and public/favicon.svg. The pen is
  not used here: the page keeps it for the count, an outage and "all quiet".

  Regenerate after changing the service list or the look:
    node scripts/icons.mjs
  which also redraws the favicon and the app icons.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Status link preview</title>
<style>
  @font-face {
    font-family: "Inter";
    src: url("../src/fonts/inter-var.woff2") format("woff2");
    font-weight: 400 700;
    font-style: normal;
  }
  :root {
    --bg: #f4f1eb;
    --fg: #1b1a17;
    --muted: #57534b;
    --subtle: #6a655c;
    --accent: #2c4a72;
    --ok: #1b7048;
    --font: "Inter", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: var(--font);
    font-optical-sizing: auto;
    color: var(--fg);
    background: var(--bg);
    padding: 88px 96px 72px;
    display: flex;
    flex-direction: column;
  }
  h1 {
    align-self: flex-start;
    font-size: 176px;
    line-height: 176px;
    font-weight: 640;
    letter-spacing: -0.028em;
  }
  .question {
    margin-top: 48px;
    font-size: 56px;
    line-height: 64px;
    font-weight: 450;
    letter-spacing: -0.02em;
    color: var(--muted);
  }
  .marks { margin-top: auto; width: 1008px; height: 56px; display: block; color: var(--ok); }
  .site { margin-top: 28px; font-size: 26px; line-height: 32px; color: var(--subtle); letter-spacing: -0.01em; }
</style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="ok" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9.4" fill="none" stroke="currentColor" stroke-width="1.7"/>
      <path d="M7.7 12.5l3 2.9 5.7-6.4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
  </svg>
  <h1>Status</h1>
  <p class="question">Is it them or is it me?</p>
  <svg class="marks" viewBox="0 0 1008 56" aria-hidden="true"><use href="#ok" x="0.0" y="6" width="44" height="44"/><use href="#ok" x="48.2" y="6" width="44" height="44"/><use href="#ok" x="96.4" y="6" width="44" height="44"/><use href="#ok" x="144.6" y="6" width="44" height="44"/><use href="#ok" x="192.8" y="6" width="44" height="44"/><use href="#ok" x="241.0" y="6" width="44" height="44"/><use href="#ok" x="289.2" y="6" width="44" height="44"/><use href="#ok" x="337.4" y="6" width="44" height="44"/><use href="#ok" x="385.6" y="6" width="44" height="44"/><use href="#ok" x="433.8" y="6" width="44" height="44"/><use href="#ok" x="482.0" y="6" width="44" height="44"/><use href="#ok" x="530.2" y="6" width="44" height="44"/><use href="#ok" x="578.4" y="6" width="44" height="44"/><use href="#ok" x="626.6" y="6" width="44" height="44"/><use href="#ok" x="674.8" y="6" width="44" height="44"/><use href="#ok" x="723.0" y="6" width="44" height="44"/><use href="#ok" x="771.2" y="6" width="44" height="44"/><use href="#ok" x="819.4" y="6" width="44" height="44"/><use href="#ok" x="867.6" y="6" width="44" height="44"/><use href="#ok" x="915.8" y="6" width="44" height="44"/><use href="#ok" x="964.0" y="6" width="44" height="44"/></svg>
  <p class="site">status.szolotov.com</p>
</body>
</html>
