# The only vulnerabilities `docker compose run --rm security` (trivy) accepts.
#
# Three advisories in dependencies that the npm CLI bundles inside itself:
# brace-expansion 5.0.9 and undici 6.28.0, listed in tools/npm/package-lock.json
# because that lockfile pins npm 11.19.1 by hash. That npm runs in CI only and
# never ships to users. Every published npm (11.19.1, 11.20.0, 12.1.0) bundles
# these same versions, so moving the pin does not clear them. Owner decision.
#
# Each entry is scoped to that one lockfile and expires on its own, so the
# exception lapses instead of lingering; trivy reports the finding again from
# 2026-12-31. Trivy names an advisory by its CVE ID when it has one and by its
# GHSA ID otherwise, so both are listed. Do not add entries: scripts/ci/npm-pin.test.ts
# fails on any ID beyond these, on a missing path, and on a missing expiry.
#
# Remove the whole file when npm bundles brace-expansion >=5.0.12 and
# undici >=6.28.1 (and the allow-ghsas line in .github/workflows/dependency-review.yml).
vulnerabilities:
  - id: GHSA-qhr7-859c-m2p7
    paths:
      - tools/npm/package-lock.json
    expired_at: 2026-12-31
    statement: brace-expansion 5.0.9, bundled in the pinned npm CLI (CI only, not shipped)
  - id: CVE-2026-102278
    paths:
      - tools/npm/package-lock.json
    expired_at: 2026-12-31
    statement: brace-expansion 5.0.9, bundled in the pinned npm CLI (CI only, not shipped)
  - id: GHSA-6j4f-fj2g-mc7p
    paths:
      - tools/npm/package-lock.json
    expired_at: 2026-12-31
    statement: brace-expansion 5.0.9, bundled in the pinned npm CLI (CI only, not shipped)
  - id: CVE-2026-102276
    paths:
      - tools/npm/package-lock.json
    expired_at: 2026-12-31
    statement: brace-expansion 5.0.9, bundled in the pinned npm CLI (CI only, not shipped)
  - id: GHSA-rfgv-xxqx-mfg5
    paths:
      - tools/npm/package-lock.json
    expired_at: 2026-12-31
    statement: undici 6.28.0, bundled in the pinned npm CLI (CI only, not shipped)
  - id: CVE-2026-19534
    paths:
      - tools/npm/package-lock.json
    expired_at: 2026-12-31
    statement: undici 6.28.0, bundled in the pinned npm CLI (CI only, not shipped)
